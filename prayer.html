<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>點燃守望之火 · 提出代禱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: radial-gradient(120% 80% at 50% -10%, #FFF2E2 0%, #FAF6F0 50%, #F5EEE6 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      min-height: 100vh;
    }
    .lux-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(234, 218, 198, 0.85);
      box-shadow: 0 16px 36px -6px rgba(184, 134, 76, 0.12);
      border-radius: 28px;
    }
    .btn-warm {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px -2px rgba(234, 88, 12, 0.38);
    }
  </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">
  <div class="lux-card w-full max-w-sm p-6 sm:p-7 space-y-4 relative">
    
    <div class="text-center space-y-1.5">
      <div class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 mx-auto flex items-center justify-center text-2xl shadow-sm mb-2">
        🙏
      </div>
      <h2 class="text-xl font-black text-stone-800 tracking-tight" id="churchTitle">守望之火 · 提出代禱</h2>
      <p class="text-xs text-stone-500 leading-relaxed">把你的不容易交給我們，教牧同工每天晨禱同心為你提名祈求</p>
    </div>

    <div class="space-y-3 text-xs pt-1">
      <div>
        <label class="font-bold text-stone-700 block mb-1">為誰代禱（您的真實姓名或稱呼）*</label>
        <input type="text" id="pName" placeholder="載入稱呼中..." class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-semibold focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>

      <div>
        <label class="font-bold text-stone-700 block mb-1">代禱具體內容 *</label>
        <textarea id="pContent" rows="4" placeholder="請告訴我們你想被守望的事項（如職場瓶頸、人際家庭、身體健康、心靈重擔）..." class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-400 leading-relaxed"></textarea>
      </div>

      <div>
        <label class="font-bold text-stone-700 block mb-1">守望性質</label>
        <select id="pUrgency" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-2.5 text-stone-800 font-semibold focus:outline-none cursor-pointer">
          <option value="一般">一般日常守望</option>
          <option value="緊急">🚨 緊急代禱（重大抉擇、病痛急難）</option>
        </select>
      </div>
    </div>

    <button onclick="submitPrayer()" id="submitBtn" class="w-full py-3.5 rounded-2xl btn-warm font-extrabold text-xs tracking-wider uppercase shadow-md active:scale-98 transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-fire text-amber-200"></i>
      <span>點亮守望燭火，送出代禱</span>
    </button>
  </div>

  <script>
    const SUPABASE_URL = "https://vpysepgvweabioklppda.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6Uhqw7j8vLSuI9nOqsFVzA_YYRXfrjL";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    let rawChurch = (urlParams.get('church') || 'SHiNE').trim();
    if (rawChurch === 'M' || rawChurch === 'M ' || rawChurch.startsWith('M')) {
      rawChurch = 'M+';
    }
    const churchId = rawChurch;
    let currentLineUserId = '';

    const LIFF_IDS = {
      'SHiNE': '2011645391-rBmBFx40',
      'M+': '2011645391-7JHlvDUE'
    };

    document.getElementById('churchTitle').innerText = (churchId === 'SHiNE' ? '火樂教會' : 'Ｍ＋大雅教會') + ' · 守望之火';

    async function initLiff() {
      const targetLiffId = LIFF_IDS[churchId] || LIFF_IDS['SHiNE'];
      try {
        if (window.liff) {
          await liff.init({ liffId: targetLiffId });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentLineUserId = profile.userId;

            // 1. 若此 LINE ID 已經綁定過會友，直接帶入真實姓名
            const { data: member } = await db.from('members')
              .select('name')
              .eq('church_id', churchId)
              .eq('line_id', currentLineUserId)
              .maybeSingle();

            if (member) {
              document.getElementById('pName').value = member.name;
            } else {
              // 2. 尚未綁定時，先以 LINE 暱稱作為預設提示
              document.getElementById('pName').value = profile.displayName || '';
            }
          }
        }
      } catch (e) {
        console.error("LIFF Init Error:", e);
      }

      if (!document.getElementById('pName').value || document.getElementById('pName').value === '載入稱呼中...') {
        document.getElementById('pName').value = '';
        document.getElementById('pName').placeholder = '請輸入姓名';
      }
    }

    initLiff();

    async function submitPrayer() {
      const name = document.getElementById('pName').value.trim();
      const content = document.getElementById('pContent').value.trim();
      const urgency = document.getElementById('pUrgency').value;

      if (!name || !content) {
        return alert('請完整填寫姓名與代禱內容喔！');
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在為您點亮守望燭火...';

      // 1. 背景自動綁定機制：拿填寫的姓名比對名冊並寫入 LINE ID
      if (currentLineUserId) {
        try {
          const { data: matchMember } = await db.from('members')
            .select('id, name, line_id')
            .eq('church_id', churchId)
            .eq('name', name)
            .maybeSingle();

          if (matchMember && (!matchMember.line_id || matchMember.line_id !== currentLineUserId)) {
            await db.from('members')
              .update({ line_id: currentLineUserId })
              .eq('id', matchMember.id);
            console.log(`✅ 成功為 ${name} 自動關聯 LINE ID: ${currentLineUserId}`);
          }
        } catch (bindErr) {
          console.error("背景自動綁定跳過:", bindErr);
        }
      }

      // 2. 送出代禱到資料庫
      const { error } = await db.from('prayer_requests').insert([{
        church_id: churchId,
        member_name: name,
        line_user_id: currentLineUserId || null,
        content: content,
        urgency_level: urgency,
        status: '待守望',
        created_at: new Date().toISOString()
      }]);

      if (error) {
        btn.disabled = false;
        btn.innerHTML = '點亮守望燭火，送出代禱';
        return alert('送出失敗：' + error.message);
      }

      // 3. 即時通知牧者本人 (完整 await 確保送達)
      try {
        const notifyUrl = `${SUPABASE_URL}/functions/v1/line-bot?action=notify_pastor&church=${encodeURIComponent(churchId)}`;
        const res = await fetch(notifyUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify({
            memberName: name,
            content: content,
            urgency: urgency
          })
        });
        const resData = await res.json();
        console.log("牧者通知結果:", resData);
      } catch (notifyErr) {
        console.error("通知牧者連線異常:", notifyErr);
      }

      alert('🕯️ 守望燭火已為您點亮！牧者與教牧同工將同心為您切切守望。');

      if (window.liff && liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>
