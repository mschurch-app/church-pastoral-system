<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ｍ＋大雅教會 · 讀經生命樹</title>

  <!-- Tailwind CSS & FontAwesome & LIFF & Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
      background: #eef9ff;
      color: #334155;
      overflow-x: hidden;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
    }

    .bg-storybook-sky {
      background: radial-gradient(circle at 75% 20%, #fffbeb 0%, #e0f4ff 50%, #f0fdf4 100%);
    }

    @keyframes cute-sway {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(1.2deg) scale(1.008); }
    }
    .tree-sway-cute {
      transform-origin: 380px 625px;
      animation: cute-sway 4.5s ease-in-out infinite;
    }

    @keyframes aura-pulse {
      0%, 100% { transform: scale(1); opacity: 0.45; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }
    .sun-aura {
      transform-origin: 640px 140px;
      animation: aura-pulse 5s ease-in-out infinite;
    }

    @keyframes tree-glow-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.55; transform: scale(1.03); }
    }
    .tree-glow {
      transform-origin: 380px 360px;
      animation: tree-glow-pulse 4s ease-in-out infinite;
    }

    @keyframes float-pollen {
      0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
      30% { opacity: 0.9; }
      70% { opacity: 0.8; }
      100% { transform: translate(60px, -90px) scale(1.2); opacity: 0; }
    }
    .pollen {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fef08a 0%, rgba(254, 240, 138, 0) 80%);
      pointer-events: none;
      animation: float-pollen 5s infinite ease-out;
    }

    @keyframes water-glide {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    .water-flow {
      stroke-dasharray: 16, 12;
      animation: water-glide 4s linear infinite;
    }

    .glass-bubble-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 32px -6px rgba(34, 197, 94, 0.12), 0 6px 12px -2px rgba(245, 158, 11, 0.06);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-storybook-sky select-none pb-8">

  <!-- 電腦測試工具條 (僅在非 LINE 環境顯示) -->
  <div id="devTestBar" class="bg-amber-500 text-stone-950 px-4 py-2 text-xs font-black flex flex-wrap items-center justify-between gap-2 shadow-md z-30">
    <div class="flex items-center gap-2">
      <span class="bg-amber-900 text-white px-2 py-0.5 rounded-md text-[10px]">電腦測試模式</span>
      <span>模擬測試身分：</span>
      <select id="devUserSelect" onchange="switchDevUser(this.value)" class="bg-white px-2 py-1 rounded-md text-xs font-bold border border-amber-600 cursor-pointer">
        <option value="吳俊璋牧師">吳俊璋 牧師 (測試主帳號)</option>
        <option value="曾恩茹">曾恩茹 同工</option>
        <option value="測試會友A">測試會友 A</option>
      </select>
    </div>
    <div class="flex items-center gap-1.5">
      <span>快速灌章數：</span>
      <button onclick="devAddChapters(10)" class="bg-white hover:bg-amber-100 px-2 py-1 rounded text-[11px] font-bold shadow-sm">+10章</button>
      <button onclick="devAddChapters(50)" class="bg-white hover:bg-amber-100 px-2 py-1 rounded text-[11px] font-bold shadow-sm">+50章</button>
      <button onclick="devAddChapters(200)" class="bg-white hover:bg-amber-100 px-2 py-1 rounded text-[11px] font-bold shadow-sm">+200章 (看大樹)</button>
      <button onclick="devResetProgress()" class="bg-rose-100 hover:bg-rose-200 text-rose-800 px-2 py-1 rounded text-[11px] font-bold shadow-sm">歸零重測</button>
    </div>
  </div>

  <!-- 頂部：會友名牌與連續天數 -->
  <header class="p-4 z-20 flex justify-between items-center max-w-lg w-full mx-auto">
    <div class="flex items-center gap-2.5">
      <img id="userAvatar" class="w-11 h-11 rounded-full border-2 border-amber-300 shadow-md object-cover bg-amber-50" src="https://api.dicebear.com/7.x/bottts/svg?seed=Grace" alt="User Avatar">
      <div>
        <div class="flex items-center gap-1.5">
          <span id="userNameLabel" class="text-sm font-black text-slate-800 tracking-tight">載入中...</span>
          <span id="badgeSeason" class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-100 text-emerald-800 border border-emerald-200">
            🌱 春萌
          </span>
        </div>
        <p class="text-[11px] text-amber-700/90 font-bold flex items-center gap-1 mt-0.5">
          <i class="fa-solid fa-fire text-orange-500"></i> 連續讀經 <span id="streakDays" class="font-mono text-xs">0</span> 天
        </p>
      </div>
    </div>

    <!-- 章數進度 -->
    <div class="text-right bg-white/80 px-3 py-1.5 rounded-2xl border border-amber-200 shadow-sm">
      <span class="text-[10px] text-slate-400 block font-bold">Ｍ＋通讀進度</span>
      <span class="text-xs font-black text-emerald-600 font-mono"><strong id="lblChapters" class="text-sm">0</strong>/1189章</span>
    </div>
  </header>

  <!-- 中央畫卷舞台 (生命樹 SVG) -->
  <main class="flex-1 flex items-center justify-center relative w-full overflow-hidden">
    <div id="particlesContainer" class="absolute inset-0 pointer-events-none"></div>

    <div class="relative w-full max-w-md aspect-square flex items-center justify-center">
      <svg id="treeCanvas" viewBox="0 0 800 800" class="w-full h-full filter drop-shadow-lg">
        <defs>
          <radialGradient id="sunAuraGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
            <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.4" />
            <stop offset="80%" stop-color="#bae6fd" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="treeCrownAuraGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.5" />
            <stop offset="60%" stop-color="#bbf7d0" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="cuteTrunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#9a5a3a" /><stop offset="35%" stop-color="#c8825c" /><stop offset="70%" stop-color="#df9a75" /><stop offset="100%" stop-color="#8a4d30" />
          </linearGradient>

          <linearGradient id="signboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fef3c7" /><stop offset="100%" stop-color="#fde68a" />
          </linearGradient>

          <radialGradient id="cuteLeafBubbleGrad" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#bbf7d0" /><stop offset="45%" stop-color="#4ade80" /><stop offset="90%" stop-color="#16a34a" /><stop offset="100%" stop-color="#15803d" />
          </radialGradient>

          <linearGradient id="highlightLeafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.9" /><stop offset="100%" stop-color="#86efac" stop-opacity="0.2" />
          </linearGradient>

          <linearGradient id="cuteSproutGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#4ade80" /><stop offset="100%" stop-color="#bef264" />
          </linearGradient>

          <linearGradient id="cuteRiverGrad" x1="0%" y1="0%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#38bdf8" /><stop offset="50%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>

          <linearGradient id="cuteHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#86efac" /><stop offset="40%" stop-color="#4ade80" /><stop offset="100%" stop-color="#22c55e" />
          </linearGradient>

          <radialGradient id="cuteGoldenFruitGrad" cx="30%" cy="25%" r="75%">
            <stop offset="0%" stop-color="#ffffff" /><stop offset="25%" stop-color="#fef08a" /><stop offset="60%" stop-color="#fbbf24" /><stop offset="90%" stop-color="#f59e0b" /><stop offset="100%" stop-color="#d97706" />
          </radialGradient>
        </defs>

        <!-- 背景 -->
        <g id="layerBackgroundAura">
          <path d="M 0,530 Q 240,460 440,510 Q 640,450 800,520 L 800,700 L 0,700 Z" fill="#bae6fd" opacity="0.45"/>
          <path d="M 0,560 Q 320,500 580,560 Q 720,530 800,560 L 800,800 L 0,800 Z" fill="#bbf7d0" opacity="0.5"/>
          <circle cx="640" cy="140" r="160" fill="url(#sunAuraGrad)" class="sun-aura"/>
          <circle cx="640" cy="140" r="36" fill="#fffbeb" filter="drop-shadow(0 0 12px #fef08a)"/>
          <polygon points="640,140 220,780 460,780" fill="url(#sunAuraGrad)" opacity="0.35"/>
          <circle id="treeAuraCircle" cx="380" cy="350" r="180" fill="url(#treeCrownAuraGrad)" class="tree-glow"/>
        </g>

        <!-- 生命溪流 -->
        <g id="layerRiver">
          <path d="M 520,550 C 490,580 430,600 440,630 C 455,660 520,680 530,715 C 545,750 610,775 690,800 L 800,800 L 800,730 C 700,695 620,650 590,610 C 570,580 560,565 540,550 Z" fill="url(#cuteRiverGrad)"/>
          <path d="M 530,570 C 470,620 500,670 580,725 C 630,760 700,785 780,800" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8" class="water-flow"/>
        </g>

        <!-- 前景大地草坡 -->
        <g id="layerGround">
          <path d="M 0,580 Q 180,550 360,585 C 420,595 445,625 410,665 C 380,700 410,745 440,775 L 460,800 L 0,800 Z" fill="url(#cuteHillGrad)"/>
          <path d="M 560,555 Q 680,535 800,565 L 800,730 C 710,690 630,645 600,605 Q 575,570 560,555 Z" fill="#4ade80" opacity="0.9"/>
          <ellipse cx="435" cy="640" rx="18" ry="10" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
        </g>

        <!-- 樹木本體 -->
        <g id="treeGroup" class="tree-sway-cute">
          <g id="layerTrunk"></g>
          <g id="layerBranches"></g>
          <g id="layerLeaves"></g>
          <g id="layerBlossoms"></g>
          <g id="layerFruits"></g>
          <g id="layerBirds"></g>
          <g id="layerBaseTufts"></g>
        </g>

        <!-- 終章光柱 -->
        <polygon id="godRaysCrown" points="380,0 160,620 600,620" fill="url(#sunAuraGrad)" opacity="0" class="transition-opacity duration-1000"/>
      </svg>
    </div>
  </main>

  <!-- 底部操作區 -->
  <footer class="p-4 z-20 max-w-lg w-full mx-auto space-y-3">
    <div class="glass-bubble-card p-4 rounded-2xl flex items-center justify-between">
      <div class="pr-2">
        <div class="flex items-center gap-1.5 text-xs font-black text-amber-700">
          <span>第 <strong id="lblWeekNum" class="font-mono text-sm text-amber-600">1</strong> 週</span>
          <span id="lblStageTitle" class="text-slate-700">小種子破土 · 幸福萌芽</span>
        </div>
        <p id="lblVerseShort" class="text-[11px] text-slate-500 font-medium truncate max-w-[240px] mt-0.5">
          「他要像一棵樹栽在溪水旁，按時候結果子。」
        </p>
      </div>
      <button onclick="openCheckinModal()" class="py-3 px-5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-95 text-white font-black text-xs shadow-lg shadow-orange-500/30 flex items-center gap-1.5 flex-shrink-0">
        <i class="fa-solid fa-book-bible text-sm"></i>
        <span>讀經打卡</span>
      </button>
    </div>
  </footer>

  <!-- 打卡抽屜彈窗 -->
  <div id="checkinModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeCheckinModal()">
    <div class="glass-bubble-card w-full sm:max-w-md rounded-t-[32px] sm:rounded-3xl p-6 space-y-4 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-sm">📖</div>
          <h3 class="text-base font-black text-slate-800">今日讀經打卡 · Ｍ＋大雅</h3>
        </div>
        <button onclick="closeCheckinModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="font-bold text-slate-600 block mb-1">選擇聖經書卷 *</label>
          <select id="selBook" onchange="onBookChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400 cursor-pointer"></select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-bold text-slate-600 block mb-1">起始章 *</label>
            <select id="selStartChap" onchange="calcReadChapters()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-800 focus:outline-none cursor-pointer"></select>
          </div>
          <div>
            <label class="font-bold text-slate-600 block mb-1">結束章 *</label>
            <select id="selEndChap" onchange="calcReadChapters()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-bold text-slate-800 focus:outline-none cursor-pointer"></select>
          </div>
        </div>

        <div class="p-3 bg-amber-50/80 rounded-xl border border-amber-200/80 flex items-center justify-between font-bold">
          <span class="text-amber-900">本次打卡累計進度：</span>
          <span class="text-orange-600 font-black text-sm font-mono">+<span id="readCountLabel">1</span> 章</span>
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">今日最有感動的亮光經文（選填）</label>
          <input type="text" id="goldenVerse" placeholder="例如：耶和華是我的牧者，我必不至缺乏。" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none">
        </div>

        <div>
          <label class="font-bold text-slate-600 block mb-1">靈修一句話領受（選填，將化為金果掛於樹梢）</label>
          <textarea id="reflection" rows="2" placeholder="寫下神今日對你說的一句話..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-800 focus:outline-none leading-relaxed"></textarea>
        </div>
      </div>

      <div class="pt-2">
        <button onclick="submitCheckin()" id="btnSubmitCheckin" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 active:scale-95 text-white text-xs font-black shadow-lg shadow-orange-500/25 flex items-center justify-center gap-1.5">
          <span>完成打卡 · 滋養生命樹</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 點擊果實或木牌彈窗 -->
  <div id="fruitModal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeFruitModal()">
    <div class="glass-bubble-card p-6 rounded-[36px] max-w-xs w-full text-center space-y-3.5 border-2 border-amber-300 shadow-2xl" onclick="event.stopPropagation()">
      <div id="modalIconContainer" class="w-14 h-14 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-200 text-amber-900 flex items-center justify-center text-2xl mx-auto shadow-lg shadow-amber-400/30">
        <i id="modalIcon" class="fa-solid fa-apple-whole"></i>
      </div>
      <h3 id="modalTitle" class="text-base font-black text-slate-800">生命樹之果 · 今日亮光</h3>
      <p id="modalVerse" class="text-xs text-slate-600 font-bold leading-relaxed">
        「你的話是我腳前的燈，是我路上的光。」
      </p>
      <div class="pt-2">
        <button onclick="closeFruitModal()" class="w-full py-2.5 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-400 text-white text-xs font-black shadow-md shadow-orange-400/30 active:scale-95">感謝收下這份應許 ✨</button>
      </div>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 (保證立即可見 + 健全防呆版) -->
  <script>
    const BIBLE_BOOKS = [
      { name: "創世記", chapters: 50 }, { name: "出埃及記", chapters: 40 }, { name: "利未記", chapters: 27 }, { name: "民數記", chapters: 36 },

      { name: "彼得前書", chapters: 5 }, { name: "彼得後書", chapters: 3 }, { name: "約翰一書", chapters: 5 }, { name: "約翰二書", chapters: 1 },
      { name: "約翰三書", chapters: 1 }, { name: "猶大書", chapters: 1 }, { name: "啟示錄", chapters: 22 }
    ];

    const WEEK_DATA = {
      1: { title: "小種子破土 · 幸福萌芽", verse: "「他要像一棵樹栽在溪水旁，按時候結果子，葉子也不枯乾。」—— 詩篇 1:3" },

      13: { title: "首季小苗 · 扎下好根", verse: "「使基督因你們的信，住在你們心裡，愛心有根有基。」—— 以弗所書 3:17" },

    window.onBookChange = function() {
      const selBookEl = document.getElementById('selBook');
      if (!selBookEl) return;
      const bookIdx = parseInt(selBookEl.value, 10);
      const book = BIBLE_BOOKS[bookIdx];
      const startSel = document.getElementById('selStartChap');
      const endSel = document.getElementById('selEndChap');
      if (!startSel || !endSel) return;

      let options = '';
      for (let i = 1; i <= book.chapters; i++) {
        options += `<option value="${i}">第 ${i} 章</option>`;
      }
      startSel.innerHTML = options;
      endSel.innerHTML = options;

      startSel.value = 1;
      endSel.value = Math.min(3, book.chapters);
      calcReadChapters();
    };

    window.calcReadChapters = function() {
      const startSel = document.getElementById('selStartChap');
      const endSel = document.getElementById('selEndChap');
      const readCountLabel = document.getElementById('readCountLabel');
      if (!startSel || !endSel || !readCountLabel) return;

      const start = parseInt(startSel.value, 10);
      let end = parseInt(endSel.value, 10);
      if (end < start) {
        endSel.value = start;
        end = start;
      }
      const count = (end - start) + 1;
      readCountLabel.innerText = count;
    };

    function calculateStage(chapters) {
      const p = Math.min((chapters || 0) / 1189, 1);
      return Math.max(1, Math.min(52, Math.ceil(p * 52)));
    }

    // 更新介面 UI (首屏立即呼叫，瞬間解除「載入中...」)
    function updateUI() {
      const lblChapters = document.getElementById('lblChapters');
      const streakDays = document.getElementById('streakDays');
      const userNameLabel = document.getElementById('userNameLabel');
      const userAvatar = document.getElementById('userAvatar');
      const lblWeekNum = document.getElementById('lblWeekNum');
      const lblStageTitle = document.getElementById('lblStageTitle');
      const lblVerseShort = document.getElementById('lblVerseShort');
      const badgeSeason = document.getElementById('badgeSeason');

      if (lblChapters) lblChapters.innerText = appState.totalChapters;
      if (streakDays) streakDays.innerText = appState.streakDays;
      if (userNameLabel) userNameLabel.innerText = appState.displayName;
      if (userAvatar && appState.avatarUrl) userAvatar.src = appState.avatarUrl;

      appState.currentWeek = calculateStage(appState.totalChapters);
      if (lblWeekNum) lblWeekNum.innerText = appState.currentWeek;

      let info = WEEK_DATA[appState.currentWeek];
      if (!info) {
        const prevWeeks = Object.keys(WEEK_DATA).map(Number).filter(w => w <= appState.currentWeek);
        info = WEEK_DATA[Math.max(...prevWeeks)];
      }
      if (lblStageTitle && info) lblStageTitle.innerText = info.title;
      if (lblVerseShort && info) lblVerseShort.innerText = info.verse;

      if (badgeSeason) {
        if (appState.currentWeek <= 13) badgeSeason.innerText = "🌱 春萌";
        else if (appState.currentWeek <= 26) badgeSeason.innerText = "🌿 夏盛";
        else if (appState.currentWeek <= 39) badgeSeason.innerText = "🌸 秋華";
        else badgeSeason.innerText = "👑 榮美";
      }

      renderTree(appState.currentWeek);
    }

    // 載入 Supabase 數據 (背景非同步執行)
    async function loadUserProfile() {
      if (!supabase) {
        console.warn("尚未連接 Supabase，目前在純前端沙盒運行");
        updateUI();
        return;
      }

      try {
        const { data, error } = await supabase
          .from('user_tree_profiles')
          .select('*')
          .eq('church_id', appState.churchId)
          .eq('line_user_id', appState.lineUserId)
          .maybeSingle();

        if (data) {
          appState.totalChapters = data.total_chapters || 0;
          appState.streakDays = data.streak_days || 0;
          appState.displayName = data.member_name || appState.displayName;
        } else {
          // 首次造訪，寫入資料表
          await supabase.from('user_tree_profiles').insert([{
            church_id: appState.churchId,
            member_name: appState.displayName,
            line_user_id: appState.lineUserId,
            line_display_name: appState.displayName,
            avatar_url: appState.avatarUrl,
            total_chapters: 0,
            streak_days: 0,
            tree_level: 1
          }]);
        }

        // 讀取果子
        const { data: fruits } = await supabase
          .from('tree_fruits')
          .select('*')
          .eq('church_id', appState.churchId)
          .eq('line_user_id', appState.lineUserId)
          .order('created_at', { ascending: true });

        appState.fruitsList = fruits || [];
        updateUI();
      } catch (err) {
        console.warn('Supabase 連線讀取異常:', err.message);
        updateUI();
      }
    }

    // 送出打卡
    window.submitCheckin = async function() {
      const bookIdx = parseInt(document.getElementById('selBook').value, 10);
      const bookName = BIBLE_BOOKS[bookIdx].name;
      const startChap = parseInt(document.getElementById('selStartChap').value, 10);
      const endChap = parseInt(document.getElementById('selEndChap').value, 10);
      const chaptersRead = (endChap - startChap) + 1;
      const goldenVerse = document.getElementById('goldenVerse').value.trim();
      const reflection = document.getElementById('reflection').value.trim();

      const btn = document.getElementById('btnSubmitCheckin');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>記錄中...</span>`;

      try {
        if (supabase) {
          const { data: checkinData } = await supabase.from('bible_checkins').insert([{
            church_id: appState.churchId,
            member_name: appState.displayName,
            line_user_id: appState.lineUserId,
            book_name: bookName,
            start_chapter: startChap,
            end_chapter: endChap,
            chapters_read: chaptersRead,
            golden_verse: goldenVerse,
            reflection: reflection
          }]).select();

          if (reflection || goldenVerse) {
            await supabase.from('tree_fruits').insert([{
              church_id: appState.churchId,
              member_name: appState.displayName,
              line_user_id: appState.lineUserId,
              checkin_id: checkinData ? checkinData[0]?.id : null,
              verse_text: goldenVerse,
              reflection: reflection
            }]);
          }

          const newTotal = appState.totalChapters + chaptersRead;
          const newStreak = appState.streakDays + 1;

          await supabase.from('user_tree_profiles').update({
            total_chapters: newTotal,
            streak_days: newStreak,
            tree_level: calculateStage(newTotal),
            last_checkin_date: new Date().toISOString().split('T')[0]
          }).eq('church_id', 'M+').eq('line_user_id', appState.lineUserId);
        } else {
          // 純本機測試 fallback
          appState.totalChapters += chaptersRead;
          appState.streakDays += 1;
          if (reflection || goldenVerse) {
            appState.fruitsList.push({ verse_text: goldenVerse, reflection: reflection });
          }
        }

        alert(`🎉 讚美主！成功打卡 ${bookName} ${startChap}~${endChap} 章（共 ${chaptersRead} 章）！生命樹正茂盛生長！`);
        closeCheckinModal();
        await loadUserProfile();
      } catch (err) {
        alert('打卡完成（本地更新）：' + err.message);
        appState.totalChapters += chaptersRead;
        updateUI();
        closeCheckinModal();
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>完成打卡 · 滋養生命樹</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
      }
    };

    // 電腦測試專用函式
    window.switchDevUser = function(userName) {
      appState.displayName = userName;
      appState.lineUserId = 'DEV_USER_' + encodeURIComponent(userName);
      appState.avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(userName)}`;
      updateUI();
      loadUserProfile();
    };

    window.devAddChapters = async function(count) {
      appState.totalChapters = Math.min(1189, appState.totalChapters + count);
      appState.streakDays += 1;
      updateUI();
      if (supabase) {
        await supabase.from('user_tree_profiles').update({
          total_chapters: appState.totalChapters,
          streak_days: appState.streakDays,
          tree_level: calculateStage(appState.totalChapters)
        }).eq('church_id', 'M+').eq('line_user_id', appState.lineUserId);
      }
    };

    window.devResetProgress = async function() {
      if (!confirm('確定重置此測試帳號進度？')) return;
      appState.totalChapters = 0;
      appState.streakDays = 0;
      appState.fruitsList = [];
      updateUI();
      if (supabase) {
        await supabase.from('user_tree_profiles').update({
          total_chapters: 0,
          streak_days: 0,
          tree_level: 1
        }).eq('church_id', 'M+').eq('line_user_id', appState.lineUserId);
        await supabase.from('tree_fruits').delete().eq('church_id', 'M+').eq('line_user_id', appState.lineUserId);
      }
    };

    window.openCheckinModal = () => document.getElementById('checkinModal').classList.remove('hidden');
    window.closeCheckinModal = () => document.getElementById('checkinModal').classList.add('hidden');

    window.openFruitModal = (idx, dataEncoded) => {
      let data = null;
      try { data = JSON.parse(decodeURIComponent(dataEncoded)); } catch(e){}

      document.getElementById('modalIcon').className = "fa-solid fa-apple-whole";
      document.getElementById('modalTitle').innerText = "生命樹之果 · 靈修亮光";
      if (data && (data.verse_text || data.reflection)) {
        document.getElementById('modalVerse').innerHTML = `
          ${data.verse_text ? `「${data.verse_text}」<br>` : ''}
          ${data.reflection ? `<span class="text-amber-700 font-bold mt-1 block">💡 心得：${data.reflection}</span>` : ''}
        `;
      } else {
        document.getElementById('modalVerse').innerText = "「你的話是我腳前的燈，是我路上的光。」—— 詩篇 119:105";
      }
      document.getElementById('fruitModal').classList.remove('hidden');
    };

    window.openSignboardModal = () => {
      document.getElementById('modalIcon').className = "fa-solid fa-cross";
      document.getElementById('modalTitle').innerText = "恩典木牌 · 靈修銘言";
      document.getElementById('modalVerse').innerText = "「我是葡萄樹，你們是枝子。常在我裡面的，我也常在他裡面，這人就多結果子。」—— 約翰福音 15:5";
      document.getElementById('fruitModal').classList.remove('hidden');
    };

    window.closeFruitModal = () => document.getElementById('fruitModal').classList.add('hidden');

    // 初始化入口
    function bootstrap() {
      // 1. 第一時間立即渲染 UI，徹底消滅「載入中...」
      updateUI();
      initParticles();
      initBookSelect();

      // 2. 判斷環境
      const isLine = /Line/i.test(navigator.userAgent);
      const devBar = document.getElementById('devTestBar');

      if (!isLine) {
        if (devBar) devBar.classList.remove('hidden');
        loadUserProfile();
      } else {
        if (devBar) devBar.classList.add('hidden');
        if (window.liff) {
          liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
              return liff.getProfile();
            } else {
              liff.login();
            }
          }).then(profile => {
            if (profile) {
              appState.lineUserId = profile.userId;
              appState.displayName = profile.displayName;
              appState.avatarUrl = profile.pictureUrl;
              updateUI();
              loadUserProfile();
            }
          }).catch(err => {
            console.warn("LIFF 啟用異常，保留當前狀態:", err);
            loadUserProfile();
          });
        } else {
          loadUserProfile();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', bootstrap);
  </script>
</body>
</html>
