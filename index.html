<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHURCH OS · 智慧教牧行政治理平台</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --brand-primary: #ea580c;
      --brand-light: #fff7ed;
      --brand-glow: rgba(234, 88, 12, 0.22);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #FAF8F5; color: #1e293b; overflow-x: hidden; width: 100vw; }
    .sun-glow { position: absolute; border-radius: 9999px; filter: blur(120px); opacity: 0.45; pointer-events: none; z-index: 0; }
    .warm-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(241, 227, 211, 0.7); box-shadow: 0 10px 30px -10px rgba(180, 115, 60, 0.08); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .warm-nav { background: rgba(253, 251, 247, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(235, 220, 203, 0.8); box-shadow: 0 4px 20px rgba(180, 115, 60, 0.04); }
    .warm-modal { background: #FFFFFF; border: 1px solid rgba(241, 227, 211, 0.9); box-shadow: 0 25px 50px -12px rgba(120, 60, 20, 0.18); }
    .chip-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; user-select: none; }
    .chip-btn.selected { background-color: var(--brand-primary) !important; color: #ffffff !important; border-color: transparent !important; box-shadow: 0 4px 12px var(--brand-glow); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(210, 180, 150, 0.4); border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans pb-28 lg:pb-10 relative selection:bg-orange-200 selection:text-orange-900">

  <div class="sun-glow w-96 h-96 bg-amber-200/60 top-0 -left-20"></div>
  <div class="sun-glow w-[30rem] h-[30rem] bg-orange-200/50 bottom-10 right-0"></div>

  <!-- 頂部導航列 -->
  <header class="sticky top-0 z-40 warm-nav px-4 sm:px-8 py-3 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center space-x-3 min-w-0">
        <div id="churchLogoWrapper" class="w-10 h-10 rounded-2xl flex-shrink-0 flex items-center justify-center text-white shadow-md shadow-orange-500/20 overflow-hidden" style="background-color: var(--brand-primary)">
          <i id="churchLogoIcon" class="fa-solid fa-church text-base"></i>
          <img id="churchLogoImg" class="w-full h-full object-cover hidden" src="" alt="Logo">
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 id="currentChurchLabel" class="text-sm sm:text-base font-bold text-slate-800 tracking-tight truncate max-w-[150px] sm:max-w-none">載入中...</h1>
            <span id="adminRoleBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-orange-100/80 text-orange-800 font-semibold border border-orange-200/60 whitespace-nowrap">認證中</span>
          </div>
          <p id="currentUserLabel" class="text-[11px] text-amber-800/60 font-medium truncate">智慧教牧治理平台</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 flex-shrink-0">
        <div id="superChurchSelectorWrapper" class="hidden">
          <div class="relative">
            <select id="superChurchSelector" onchange="switchChurch(this.value)" class="appearance-none bg-white border border-amber-200 text-xs font-semibold rounded-xl pl-3 pr-7 py-2 text-slate-700 shadow-sm focus:outline-none cursor-pointer">
              <option value="SHiNE">火樂 (SHiNE)</option>
              <option value="M+">Ｍ＋大雅</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-2.5 top-3 text-[10px] text-amber-700 pointer-events-none"></i>
          </div>
        </div>
        <button onclick="logout()" class="w-9 h-9 rounded-xl bg-white hover:bg-rose-50 text-slate-500 hover:text-rose-600 border border-amber-200/70 shadow-sm flex items-center justify-center transition" title="安全登出">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 登入認證彈窗 -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="warm-modal p-6 sm:p-8 rounded-[30px] max-w-sm w-full space-y-6 shadow-2xl relative overflow-hidden">
      <div class="text-center space-y-1.5">
        <div class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl text-white shadow-lg shadow-orange-500/30 mb-3" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-heart"></i>
        </div>
        <h2 class="text-xl font-black text-slate-800 tracking-tight">歡迎回到教牧家園</h2>
        <p class="text-xs text-amber-800/70">請選取管理者同工並輸入授權密碼</p>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="text-slate-600 font-bold block mb-1.5">管理者同工</label>
          <select id="loginNameSelect" class="w-full bg-orange-50/50 border border-amber-200/80 rounded-xl px-3.5 py-3 text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-orange-400">
            <option value="吳俊璋">吳俊璋 牧師</option>
            <option value="謝碧鳳">謝碧鳳 師母</option>
            <option value="松慕強">松慕強 牧師</option>
            <option value="戴國馨">戴國馨 火樂行政</option>
            <option value="文義豪">文義豪 火樂同工</option>
            <option value="曾恩茹">曾恩茹 Ｍ＋同工</option>
            <option value="邵鈺庭">邵鈺庭 Ｍ＋行政</option>
            <option value="張捷">張捷 Ｍ＋總務</option>
          </select>
        </div>

        <div>
          <label class="text-slate-600 font-bold block mb-1.5">授權密碼</label>
          <input type="password" id="loginPwd" class="w-full bg-orange-50/50 border border-amber-200/80 rounded-xl px-3.5 py-3 text-slate-800 font-semibold focus:outline-none focus:ring-2 focus:ring-orange-400" placeholder="••••••••">
        </div>

        <p id="loginError" class="text-xs text-rose-600 font-semibold hidden flex items-center gap-1.5">
          <i class="fa-solid fa-circle-exclamation"></i> <span></span>
        </p>

        <button onclick="handleAuthLogin()" class="w-full py-3.5 rounded-xl text-white font-bold text-xs tracking-wider uppercase transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-2" style="background-color: var(--brand-primary)">
          <span>確認登入系統</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 主要內容介面 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-5 sm:py-7 relative z-10">
    
    <!-- 模組一：會友名冊 -->
    <section id="mod-members" class="space-y-5 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
        <div class="flex items-center gap-2 flex-1">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-amber-700/50 text-xs"></i>
            <input type="text" id="memberSearch" oninput="filterMembers()" placeholder="搜尋姓名、電話..." class="w-full bg-white border border-amber-200/80 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-slate-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-300">
          </div>
          <select id="memberFilterGroupSelect" onchange="filterMembers()" class="bg-white border border-amber-200/80 rounded-xl px-3 py-2.5 text-xs text-slate-700 shadow-sm focus:outline-none max-w-[140px]">
            <option value="ALL">全部<span class="group-term-label">小家</span></option>
          </select>
        </div>
        <button onclick="openMemberModal()" class="py-2.5 px-4 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 shadow-md active:scale-95" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-user-plus text-xs"></i>
          <span>新增會友</span>
        </button>
      </div>
      <div id="memberCardsStream" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
    </section>

    <!-- 模組二：主日事工服事（全面恢復建立、編輯、指派） -->
    <section id="mod-services" class="space-y-5 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
          <h2 class="text-base sm:text-lg font-black text-slate-800 tracking-tight">主日崇拜服事輪值</h2>
          <p class="text-xs text-amber-900/60 mt-0.5">掌握各週敬拜樂團、影音燈控與接待服事安排</p>
        </div>
        <button onclick="openNewServiceModal()" class="py-2.5 px-4 rounded-xl text-xs font-bold text-white shadow-md active:scale-95 flex items-center gap-1.5" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-calendar-plus text-xs"></i>
          <span>新增主日服事週次</span>
        </button>
      </div>
      <div id="serviceCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- 模組三：小家 / 小組 管理 -->
    <section id="mod-groups" class="space-y-5 hidden">
      <div class="flex justify-between items-center gap-3">
        <div>
          <h2 class="text-base sm:text-lg font-black text-slate-800 tracking-tight flex items-center gap-1.5">
            <span class="group-term-label">小家</span>行政與調配中樞
          </h2>
          <p class="text-xs text-amber-900/60 mt-0.5">架構建立、<span class="group-leader-term-label">小家長</span>指派與組員調動</p>
        </div>
        <button onclick="openGroupEditModal()" class="py-2.5 px-4 rounded-xl text-xs font-bold text-white shadow-md active:scale-95 flex items-center gap-1.5" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>新增<span class="group-term-label">小家</span></span>
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="groupCardsGrid"></div>
    </section>

    <!-- 模組四：牧養代禱關懷 -->
    <section id="mod-prayers" class="space-y-5 hidden">
      <div>
        <h2 class="text-base sm:text-lg font-black text-slate-800 tracking-tight">即時牧養關懷代禱</h2>
        <p class="text-xs text-amber-900/60 mt-0.5">來自 LINE 官方帳號的即時同工通報與守望</p>
      </div>
      <div id="prayerCardsList" class="space-y-3"></div>
    </section>

    <!-- 模組五：超級管理員控制台 -->
    <section id="mod-superadmin" class="space-y-6 hidden">
      <div class="warm-card rounded-3xl p-5 sm:p-7 space-y-4">
        <div class="border-b border-amber-100 pb-3 flex items-center justify-between">
          <h2 class="text-sm sm:text-base font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-palette" style="color: var(--brand-primary)"></i>
            <span>堂會專屬代表色系與 Logo 自訂</span>
          </h2>
          <span class="text-[10px] font-bold text-orange-800 bg-orange-100 px-2.5 py-0.5 rounded-full">Branding</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
          <div>
            <label class="text-slate-600 font-bold block mb-1.5">目標堂會</label>
            <select id="configChurchTarget" onchange="loadChurchConfigInputs()" class="w-full bg-white border border-amber-200/80 rounded-xl p-2.5 text-slate-800 font-semibold focus:outline-none">
              <option value="SHiNE">火樂教會 (SHiNE)</option>
              <option value="M+">Ｍ＋大雅教會</option>
            </select>
          </div>
          <div>
            <label class="text-slate-600 font-bold block mb-1.5">主代表色</label>
            <div class="flex gap-2">
              <input type="color" id="configColorPicker" onchange="document.getElementById('configColorText').value=this.value" class="w-10 h-10 bg-transparent border-0 cursor-pointer rounded-xl">
              <input type="text" id="configColorText" class="w-full bg-white border border-amber-200/80 rounded-xl p-2.5 text-slate-800 font-mono uppercase focus:outline-none">
            </div>
          </div>
          <div>
            <label class="text-slate-600 font-bold block mb-1.5">Logo 圖片網址 (URL)</label>
            <input type="text" id="configLogoUrl" placeholder="https://..." class="w-full bg-white border border-amber-200/80 rounded-xl p-2.5 text-slate-800 focus:outline-none">
          </div>
        </div>
        <div class="flex justify-end pt-1">
          <button onclick="saveChurchBranding()" class="py-2.5 px-5 rounded-xl text-xs font-bold text-white shadow-md active:scale-95" style="background-color: var(--brand-primary)">儲存視覺風格</button>
        </div>
      </div>

      <div class="warm-card rounded-3xl p-5 sm:p-7 space-y-4">
        <div class="flex justify-between items-center border-b border-amber-100 pb-3">
          <h2 class="text-sm sm:text-base font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-user-shield" style="color: var(--brand-primary)"></i>
            <span>管理員名冊與細部權限授權</span>
          </h2>
          <button onclick="openAdminModal()" class="py-2 px-3.5 rounded-xl text-xs font-bold text-white shadow-md active:scale-95" style="background-color: var(--brand-primary)">
            <i class="fa-solid fa-plus mr-1"></i> 指派管理員
          </button>
        </div>
        <div id="adminUsersCardsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>
    </section>
  </main>

  <!-- 底部微浮導航列 -->
  <nav class="fixed bottom-4 inset-x-4 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2 max-w-md w-full warm-nav rounded-2xl z-30 px-3 py-2 flex justify-around shadow-xl border border-amber-200/70">
    <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center gap-1 transition-all" style="color: var(--brand-primary)">
      <i class="fa-solid fa-users text-sm"></i>
      <span class="text-[10px] font-bold">會友名冊</span>
    </button>
    <button onclick="switchTab('services')" id="nav-services" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-hand-holding-heart text-sm"></i>
      <span class="text-[10px] font-bold">主日服事</span>
    </button>
    <button onclick="switchTab('groups')" id="nav-groups" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-people-roof text-sm"></i>
      <span class="text-[10px] font-bold group-term-label">小家</span>
    </button>
    <button onclick="switchTab('prayers')" id="nav-prayers" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-hands-praying text-sm"></i>
      <span class="text-[10px] font-bold">代禱關懷</span>
    </button>
    <button onclick="switchTab('superadmin')" id="nav-superadmin" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 hidden">
      <i class="fa-solid fa-screwdriver-wrench text-sm"></i>
      <span class="text-[10px] font-bold">超級權限</span>
    </button>
  </nav>

  <!-- ======================== 彈窗 MODALS ======================== -->

  <!-- 【Modal: 主日服事 建立與編輯】（全面恢復指派同工） -->
  <div id="serviceEditModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="warm-modal w-full sm:max-w-xl rounded-t-[32px] sm:rounded-3xl p-6 space-y-4 max-h-[88vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-amber-100 pb-3">
        <h3 class="text-base font-black text-slate-800 flex items-center gap-2" id="serviceModalTitle">
          <i class="fa-solid fa-hand-holding-heart" style="color: var(--brand-primary)"></i>
          <span>編輯主日服事安排</span>
        </h3>
        <button onclick="closeServiceModal()" class="w-8 h-8 rounded-full bg-amber-50 text-slate-400 hover:text-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="editServiceId">
      
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-slate-600 font-bold block mb-1">主日日期 *</label>
            <input type="text" id="svcDate" placeholder="例如：2027/04/11" class="w-full bg-orange-50/40 border border-amber-200/80 rounded-xl p-2.5 text-slate-800 font-bold focus:outline-none">
          </div>
          <div>
            <label class="text-slate-600 font-bold block mb-1">特別活動 / 節日</label>
            <input type="text" id="svcEvent" placeholder="如：復活節、母親節" class="w-full bg-orange-50/40 border border-amber-200/80 rounded-xl p-2.5 text-slate-800 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="text-slate-600 font-bold block mb-1">主日講員</label>
          <input type="text" id="svcSpeaker" placeholder="如：吳俊璋牧師" class="w-full bg-orange-50/40 border border-amber-200/80 rounded-xl p-2.5 text-slate-800 font-bold focus:outline-none">
        </div>

        <div class="p-3 rounded-2xl bg-amber-50/50 border border-amber-100 space-y-2.5">
          <span class="text-xs font-black text-amber-900 block"><i class="fa-solid fa-music mr-1 text-orange-600"></i> 敬拜樂團同工</span>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">敬拜主領</label>
              <select id="svcLeader" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">敬拜歌者</label>
              <input type="text" id="svcSingers" placeholder="歌者名單" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none">
            </div>
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">司琴鍵盤</label>
              <select id="svcKeyboard" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">吉他手</label>
              <select id="svcGuitar" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">貝斯手</label>
              <select id="svcBass" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">爵士鼓手</label>
              <select id="svcDrums" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
          </div>
        </div>

        <div class="p-3 rounded-2xl bg-orange-50/40 border border-orange-100 space-y-2.5">
          <span class="text-xs font-black text-orange-900 block"><i class="fa-solid fa-headset mr-1 text-orange-600"></i> 影音技術與招待</span>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">音控控台</label>
              <select id="svcSound" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
            <div>
              <label class="text-slate-500 text-[11px] block mb-0.5">直播/導播</label>
              <select id="svcVideo" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none"></select>
            </div>
            <div class="col-span-2">
              <label class="text-slate-500 text-[11px] block mb-0.5">主日招待同工</label>
              <input type="text" id="svcUshers" placeholder="招待人員名單" class="w-full bg-white border border-amber-200/80 rounded-xl p-2 text-slate-800 focus:outline-none">
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-amber-100">
        <button onclick="closeServiceModal()" class="py-2.5 px-4 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold">取消</button>

            <label class="flex items-center gap-2 p-2 rounded-xl bg-orange-50/40 border border-amber-200/60 cursor-pointer"><input type="checkbox" id="permPrayers" class="rounded accent-orange-600"> <span>關懷代禱</span></label>

  <script>
    const SUPABASE_URL = "https://vpysepgvweabioklppda.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6Uhqw7j8vLSuI9nOqsFVzA_YYRXfrjL";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let activeChurch = "SHiNE";
    let cachedChurches = {};
    let cachedMembers = [];
    let cachedGroups = [];
    let cachedServices = [];
    let cachedAdmins = [];
    let activeManagingGroup = null;

    const MINISTRY_OPTIONS = [
      "敬拜主領", "敬拜歌者", "司琴鍵盤", "木吉他", "電吉他", "Bass手", 
      "爵士鼓手", "音控PA", "直播導播", "投影簡報", "主日招待", 
      "主日學大童班", "主日學幼兒班", "青少輔導", "總務愛筵", "關懷代禱"
    ];
    let selectedMinistries = new Set();

    function getChurchTerms(churchId) {
      return churchId === 'SHiNE' 
        ? { group: '小家', leader: '小家長', member: '小家成員' }
        : { group: '小組', leader: '小組長', member: '小組組員' };
    }

    function updateDynamicTerms(churchId) {
      const terms = getChurchTerms(churchId);
      document.querySelectorAll('.group-term-label').forEach(el => el.innerText = terms.group);
      document.querySelectorAll('.group-leader-term-label').forEach(el => el.innerText = terms.leader);
      document.querySelectorAll('.group-member-term-label').forEach(el => el.innerText = terms.member);
    }

    async function handleAuthLogin() {
      const name = document.getElementById('loginNameSelect').value.trim();
      const pwd = document.getElementById('loginPwd').value.trim();
      const err = document.getElementById('loginError');

      const { data } = await db.from('admin_users').select('*').eq('name', name).eq('password', pwd).eq('is_active', true);
      if (!data || !data.length) {
        err.querySelector('span').innerText = "驗證密碼錯誤，請確認！";
        err.classList.remove('hidden');
        return;
      }

      currentUser = data[0];
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('currentUserLabel').innerText = `登入者：${currentUser.name}`;

      await loadChurchesConfig();

      if (currentUser.role === 'SUPER_ADMIN') {
        document.getElementById('superChurchSelectorWrapper').classList.remove('hidden');
        document.getElementById('nav-superadmin').classList.remove('hidden');
        document.getElementById('adminRoleBadge').innerText = "SUPER ADMIN";
        activeChurch = "SHiNE";
      } else {
        document.getElementById('superChurchSelectorWrapper').classList.add('hidden');
        document.getElementById('nav-superadmin').classList.add('hidden');
        document.getElementById('adminRoleBadge').innerText = "CHURCH ADMIN";
        activeChurch = currentUser.assigned_church || "SHiNE";
      }

      applyChurchTheme(activeChurch);
      updateDynamicTerms(activeChurch);
      applyPermissions();
      loadChurchData();
    }

    async function loadChurchesConfig() {
      const { data } = await db.from('churches').select('*');
      if (data) data.forEach(c => cachedChurches[c.id] = c);
    }

    function applyChurchTheme(churchId) {
      const c = cachedChurches[churchId];
      if (!c) return;
      document.getElementById('currentChurchLabel').innerText = c.name;
      const primary = c.primary_color || '#ea580c';
      document.documentElement.style.setProperty('--brand-primary', primary);
      document.documentElement.style.setProperty('--brand-glow', `${primary}38`);

      const logoImg = document.getElementById('churchLogoImg');
      const logoIcon = document.getElementById('churchLogoIcon');
      if (c.logo_url) {
        logoImg.src = c.logo_url;
        logoImg.classList.remove('hidden');
        logoIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoIcon.classList.remove('hidden');
      }
    }

    function applyPermissions() {
      if (currentUser.role === 'SUPER_ADMIN') return;
      if (!currentUser.can_manage_members) document.getElementById('nav-members').classList.add('hidden');
      if (!currentUser.can_manage_schedules) document.getElementById('nav-services').classList.add('hidden');
      if (!currentUser.can_manage_attendance) document.getElementById('nav-groups').classList.add('hidden');
      if (!currentUser.can_manage_prayers) document.getElementById('nav-prayers').classList.add('hidden');
    }

    async function loadChurchData() {
      await loadMembers();
      await loadGroups();
      await loadServices();
      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_prayers) loadPrayers();
      if (currentUser.role === 'SUPER_ADMIN') {
        loadAdminUsersList();
        loadChurchConfigInputs();
      }

      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_members) switchTab('members');
      else if (currentUser.can_manage_schedules) switchTab('services');
    }

    // 1. 會友名冊
    async function loadMembers() {
      const { data } = await db.from('members').select('*').eq('church_id', activeChurch).order('id');
      cachedMembers = data || [];
      renderMembersCards(cachedMembers);
      populateGroupFilterDropdown();
    }

    function renderMembersCards(list) {
      const container = document.getElementById('memberCardsStream');
      if (!list.length) {
        container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs">查無名冊資料</div>`;
        return;
      }
      container.innerHTML = list.map(m => {
        const hasLine = m.line_id && m.line_id.startsWith('U');
        const ministries = m.ministry ? m.ministry.split(',').map(s => s.trim()).filter(Boolean) : [];
        return `
          <div class="warm-card rounded-2xl p-4 space-y-3 flex flex-col justify-between">
            <div class="space-y-2.5">
              <div class="flex justify-between items-start">
                <div class="flex items-center gap-2.5">
                  <div class="w-10 h-10 rounded-2xl ${m.gender === '姊妹' ? 'bg-rose-100 text-rose-600' : 'bg-amber-100 text-amber-700'} flex items-center justify-center font-bold text-sm shadow-sm">
                    ${m.name.slice(0, 1)}
                  </div>
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="font-black text-slate-800 text-sm">${m.name}</span>
                      <span class="text-[10px] text-slate-400">(${m.gender})</span>
                      ${hasLine ? '<i class="fa-brands fa-line text-emerald-500 text-xs" title="已綁定 LINE"></i>' : ''}
                    </div>
                    <p class="text-[11px] text-slate-500 font-mono">${m.phone || '未登記電話'}</p>
                  </div>
                </div>
                <span class="text-[10px] font-bold px-2.5 py-1 rounded-xl bg-orange-50 border border-orange-200/60 text-orange-800">
                  ${m.group_name || '未編組'}
                </span>
              </div>
              <div class="flex flex-wrap gap-1.5 items-center">
                <span class="text-[10px] px-2 py-0.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200/50">${m.faith_status || '委身家人'}</span>
                ${m.district ? `<span class="text-[10px] px-2 py-0.5 rounded-lg bg-slate-100 text-slate-600">${m.district}</span>` : ''}
                ${ministries.map(item => `<span class="text-[10px] px-2 py-0.5 rounded-lg bg-orange-100/70 text-orange-800 font-bold">${item}</span>`).join('')}
              </div>
            </div>
            <div class="pt-2.5 border-t border-amber-100/60 flex items-center justify-between">
              <span class="text-[10px] text-slate-400">${m.register_date || '會友名冊'}</span>
              <div class="flex gap-2">
                <button onclick="editMember(${m.id})" class="text-xs px-2.5 py-1 rounded-xl bg-orange-50 hover:bg-orange-100 text-orange-800 font-bold transition">
                  <i class="fa-solid fa-pen mr-1"></i>編輯
                </button>
                <button onclick="deleteMember(${m.id})" class="text-xs px-2.5 py-1 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold transition">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function populateGroupFilterDropdown() {
      const select = document.getElementById('memberFilterGroupSelect');
      const terms = getChurchTerms(activeChurch);
      const groups = Array.from(new Set(cachedMembers.map(m => m.group_name).filter(Boolean)));
      select.innerHTML = `<option value="ALL">全部${terms.group}</option>` + groups.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    function filterMembers() {
      const q = document.getElementById('memberSearch').value.toLowerCase();
      const filterGrp = document.getElementById('memberFilterGroupSelect').value;
      const filtered = cachedMembers.filter(m => {
        const matchesQ = (m.name && m.name.toLowerCase().includes(q)) || (m.phone && m.phone.includes(q));
        const matchesGrp = filterGrp === 'ALL' || m.group_name === filterGrp;
        return matchesQ && matchesGrp;
      });
      renderMembersCards(filtered);
    }

    function renderMinistryChips() {
      const container = document.getElementById('ministryChipsContainer');
      container.innerHTML = MINISTRY_OPTIONS.map(opt => {
        const isSel = selectedMinistries.has(opt);
        return `
          <div onclick="toggleMinistryChip('${opt}')" class="chip-btn px-3 py-1 rounded-xl text-[11px] font-bold border ${isSel ? 'selected' : 'bg-orange-50/50 border-amber-200/60 text-slate-600'}">
            ${opt}
          </div>
        `;
      }).join('');
    }

    function toggleMinistryChip(name) {
      if (selectedMinistries.has(name)) selectedMinistries.delete(name);
      else selectedMinistries.add(name);
      renderMinistryChips();
    }

    function openMemberModal() {
      document.getElementById('editMemberId').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editPhone').value = '';
      populateMemberModalGroupDropdown('未編組');
      selectedMinistries.clear();
      renderMinistryChips();
      document.getElementById('memberModalTitle').querySelector('span').innerText = '新增會友資料';
      document.getElementById('memberEditModal').classList.remove('hidden');
    }

    function populateMemberModalGroupDropdown(currentGroup) {
      const select = document.getElementById('editGroupSelect');
      const groups = ['未編組', ...cachedGroups.map(g => g.name)];
      select.innerHTML = groups.map(g => `<option value="${g}" ${g === currentGroup ? 'selected' : ''}>${g}</option>`).join('');
    }

    function editMember(id) {
      const m = cachedMembers.find(x => x.id === id);
      if (!m) return;
      document.getElementById('editMemberId').value = m.id;
      document.getElementById('editName').value = m.name;
      document.getElementById('editGender').value = m.gender || '弟兄';
      document.getElementById('editPhone').value = m.phone || '';

    function populateMinistryMemberDropdown(selectId, targetKeyword, currentValue) {

      const recommended = cachedMembers.filter(m => m.ministry && m.ministry.includes(targetKeyword));

      let html = `<option value="－">－ (無)</option>`;

      html += `<optgroup label="全部同工">` + others.map(m => `<option value="${m.name}" ${m.name===currentValue?'selected':''}>${m.name}</option>`).join('') + `</optgroup>`;
      select.innerHTML = html;

    function closeAdminModal() { document.getElementById('adminUserModal').classList.add('hidden'); }

    async function saveAdminUser() {
      const id = document.getElementById('adminEditId').value;
      const name = document.getElementById('admName').value.trim();
      const pwd = document.getElementById('admPwd').value.trim();
      const church = document.getElementById('admChurch').value;

      if (!name) return alert('姓名不得為空！');
      if (!id && !pwd) return alert('新增必須設定授權碼！');

      const payload = {
        name: name, assigned_church: church,
        can_manage_members: document.getElementById('permMembers').checked,
        can_manage_schedules: document.getElementById('permSchedules').checked,
        can_manage_attendance: document.getElementById('permAttendance').checked,
        can_manage_prayers: document.getElementById('permPrayers').checked
      };
      if (pwd) payload.password = pwd;

      if (id) await db.from('admin_users').update(payload).eq('id', id);
      else { payload.role = 'CHURCH_ADMIN'; await db.from('admin_users').insert([payload]); }

      closeAdminModal();
      loadAdminUsersList();
    }

    async function deleteAdminUser(id, name) {
      if (!confirm(`確定移除【${name}】的管理員資格？`)) return;
      await db.from('admin_users').delete().eq('id', id);
      loadAdminUsersList();
    }

    function switchChurch(churchId) {
      activeChurch = churchId;
      applyChurchTheme(churchId);
      updateDynamicTerms(churchId);
      loadChurchData();
    }

    function switchTab(tabId) {
      ['members', 'services', 'groups', 'prayers', 'superadmin'].forEach(t => {
        const el = document.getElementById(`mod-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (el) el.classList.add('hidden');
        if (nav) nav.style.color = '#94a3b8';
      });
      const targetEl = document.getElementById(`mod-${tabId}`);
      const targetNav = document.getElementById(`nav-${tabId}`);
      if (targetEl) targetEl.classList.remove('hidden');
      if (targetNav) targetNav.style.color = 'var(--brand-primary)';
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('loginPwd').value = '';
    }
  </script>
</body>
</html>
