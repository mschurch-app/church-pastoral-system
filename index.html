<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHURCH OS · 智慧教牧行政治理平台</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- 頂級人文字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --brand-accent: #f97316;
      --brand-accent-hover: #ea580c;
      --brand-subtle: #ffedd5;
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(234, 218, 198, 0.75);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(120% 80% at 50% -10%, #FFF2E2 0%, #FAF6F0 50%, #F5EEE6 100%);
      color: #1c1917;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }

    .lux-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 32px -4px rgba(184, 134, 76, 0.08), 0 4px 12px -2px rgba(184, 134, 76, 0.04);
      border-radius: 24px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lux-card:hover {
      box-shadow: 0 20px 40px -4px rgba(184, 134, 76, 0.12), 0 6px 16px -2px rgba(184, 134, 76, 0.06);
      transform: translateY(-2px);
    }

    .lux-header {
      background: rgba(250, 246, 240, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(234, 218, 198, 0.8);
    }

    .lux-dock {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(234, 218, 198, 0.85);
      box-shadow: 0 20px 40px -10px rgba(120, 75, 25, 0.14);
    }

    .lux-modal {
      background: #FFFFFF;
      border: 1px solid rgba(234, 218, 198, 0.9);
      box-shadow: 0 30px 60px -12px rgba(100, 50, 10, 0.2);
    }

    .chip-item {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }
    .chip-item.active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%) !important;
      color: #ffffff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
      transform: translateY(-1px);
    }

    .btn-warm {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 6px 18px -2px rgba(234, 88, 12, 0.38);
      transition: all 0.25s ease;
    }
    .btn-warm:hover {
      box-shadow: 0 10px 24px -2px rgba(234, 88, 12, 0.48);
      transform: translateY(-1px);
    }
    .btn-warm:active {
      transform: scale(0.98);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(214, 186, 155, 0.45); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(214, 186, 155, 0.75); }
  </style>
</head>
<body class="flex flex-col font-sans pb-32 lg:pb-12 antialiased selection:bg-orange-200 selection:text-orange-950">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-40 lux-header px-4 sm:px-8 py-3.5 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      
      <!-- 堂會名牌與 Logo -->
      <div class="flex items-center space-x-3.5 min-w-0">
        <div id="churchLogoWrapper" class="w-11 h-11 rounded-2xl flex-shrink-0 flex items-center justify-center text-white shadow-md shadow-orange-500/25 overflow-hidden transition-all duration-300" style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%)">
          <i id="churchLogoIcon" class="fa-solid fa-church text-base"></i>
          <img id="churchLogoImg" class="w-full h-full object-cover hidden" src="" alt="Logo">
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 id="currentChurchLabel" class="text-base sm:text-lg font-black text-stone-800 tracking-tight truncate max-w-[160px] sm:max-w-none">
              載入中...
            </h1>
            <span id="adminRoleBadge" class="text-[10px] tracking-wide px-2.5 py-0.5 rounded-full bg-amber-100/70 text-amber-900 font-bold border border-amber-200/80 whitespace-nowrap">
              同工認證
            </span>
          </div>
          <p id="currentUserLabel" class="text-xs text-stone-500 font-medium truncate mt-0.5">智慧教牧治理平台</p>
        </div>
      </div>

      <!-- 右側切換與登出 -->
      <div class="flex items-center gap-2.5 flex-shrink-0">
        <div id="superChurchSelectorWrapper" class="hidden">
          <div class="relative">
            <select id="superChurchSelector" onchange="switchChurch(this.value)" class="appearance-none bg-white/90 border border-stone-200 text-xs font-bold rounded-xl pl-3.5 pr-8 py-2 text-stone-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400 cursor-pointer">
              <option value="SHiNE">火樂 (SHiNE)</option>
              <option value="M+">Ｍ＋大雅</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-[10px] text-stone-400 pointer-events-none"></i>
          </div>
        </div>

        <button onclick="logout()" class="w-9 h-9 rounded-xl bg-white hover:bg-rose-50 text-stone-400 hover:text-rose-600 border border-stone-200/80 shadow-sm flex items-center justify-center transition" title="安全登出">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- 登入認證彈窗 -->
  <div id="loginModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="lux-modal p-8 rounded-[32px] max-w-sm w-full space-y-6 shadow-2xl relative overflow-hidden">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-2xl text-white shadow-xl shadow-orange-500/30 mb-4" style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%)">
          <i class="fa-solid fa-cross"></i>
        </div>
        <h2 class="text-2xl font-black text-stone-800 tracking-tight">歡迎回到同工之家</h2>
        <p class="text-xs text-stone-500">請選取管理者同工並輸入授權密碼</p>
      </div>

      <div class="space-y-4 text-xs">
        <div>
          <label class="text-stone-600 font-bold block mb-1.5">管理者同工</label>
          <div class="relative">
            <select id="loginNameSelect" class="w-full appearance-none bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 font-bold focus:outline-none focus:ring-2 focus:ring-orange-400 cursor-pointer">
              <option value="吳俊璋">吳俊璋 牧師</option>
              <option value="謝碧鳳">謝碧鳳 師母</option>
              <option value="松慕強">松慕強 牧師</option>
              <option value="戴國馨">戴國馨 火樂行政</option>
              <option value="文義豪">文義豪 火樂同工</option>
              <option value="曾恩茹">曾恩茹 Ｍ＋同工</option>
              <option value="邵鈺庭">邵鈺庭 Ｍ＋行政</option>
              <option value="張捷">張捷 Ｍ＋總務</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-xs text-stone-400 pointer-events-none"></i>
          </div>
        </div>

        <div>
          <label class="text-stone-600 font-bold block mb-1.5">安全授權碼</label>
          <input type="password" id="loginPwd" class="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 font-semibold focus:outline-none focus:ring-2 focus:ring-orange-400" placeholder="••••••••">
        </div>

        <p id="loginError" class="text-xs text-rose-600 font-bold hidden flex items-center gap-1.5 pt-1">
          <i class="fa-solid fa-circle-exclamation"></i> <span></span>
        </p>

        <button onclick="handleAuthLogin()" class="w-full py-3.5 rounded-2xl btn-warm font-extrabold text-xs tracking-wider uppercase transition-all flex items-center justify-center gap-2">
          <span>安全驗證登入</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 主要內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 sm:py-8 relative z-10">
    
    <!-- 模組一：會友名冊 -->
    <section id="mod-members" class="space-y-6 hidden">
      <!-- 篩選列 -->
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
        <div class="flex items-center gap-2.5 flex-1">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-stone-400 text-xs"></i>
            <input type="text" id="memberSearch" oninput="filterMembers()" placeholder="搜尋會友姓名、電話..." class="w-full bg-white/95 border border-stone-200/90 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-stone-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <!-- 篩選下拉：純淨只讀取官方小家/小組清單 -->
          <select id="memberFilterGroupSelect" onchange="filterMembers()" class="bg-white/95 border border-stone-200/90 rounded-2xl px-3.5 py-2.5 text-xs text-stone-700 font-semibold shadow-sm focus:outline-none max-w-[150px] cursor-pointer">
            <option value="ALL">全部<span class="group-term-label">小家</span></option>
          </select>
        </div>

        <button onclick="openMemberModal()" class="py-3 px-5 rounded-2xl btn-warm text-xs font-bold flex items-center justify-center gap-2 flex-shrink-0">
          <i class="fa-solid fa-user-plus text-xs"></i>
          <span>新增會友</span>
        </button>
      </div>

      <!-- 會友卡片流 (Mobile-first 防超框) -->
      <div id="memberCardsStream" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- 模組二：主日事工服事（排程管理中樞） -->
    <section id="mod-services" class="space-y-6 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-stone-800 tracking-tight">主日崇拜事工輪值</h2>
          <p class="text-xs text-stone-500 mt-1">掌握講道、敬拜樂團、影音燈控與接待招待服事安排</p>
        </div>
        <button onclick="openNewServiceModal()" class="py-3 px-5 rounded-2xl btn-warm text-xs font-bold flex items-center gap-2 flex-shrink-0">
          <i class="fa-solid fa-calendar-plus text-xs"></i>
          <span>新增主日服事週次</span>
        </button>
      </div>
      <div id="serviceCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- 模組三：小家 / 小組 行政中樞 -->
    <section id="mod-groups" class="space-y-6 hidden">
      <div class="flex justify-between items-center gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-stone-800 tracking-tight flex items-center gap-2">
            <span class="group-term-label">小家</span>行政與調配中樞
          </h2>
          <p class="text-xs text-stone-500 mt-1">建立<span class="group-term-label">小家</span>、指派<span class="group-leader-term-label">小家長</span>與組員調動</p>
        </div>
        <button onclick="openGroupEditModal()" class="py-3 px-5 rounded-2xl btn-warm text-xs font-bold flex items-center gap-2 flex-shrink-0">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>新增<span class="group-term-label">小家</span></span>
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="groupCardsGrid"></div>
    </section>

    <!-- 模組四：牧養代禱關懷 -->
    <section id="mod-prayers" class="space-y-6 hidden">
      <div>
        <h2 class="text-xl sm:text-2xl font-black text-stone-800 tracking-tight">即時牧養關懷代禱</h2>
        <p class="text-xs text-stone-500 mt-1">來自 LINE 官方帳號的第一線守望通報需求</p>
      </div>
      <div id="prayerCardsList" class="space-y-3"></div>
    </section>

    <!-- 模組五：超級管理員控制台 -->
    <section id="mod-superadmin" class="space-y-6 hidden">
      
      <!-- 品牌自訂 -->
      <div class="lux-card p-6 sm:p-8 space-y-5">
        <div class="border-b border-stone-200/80 pb-3.5 flex items-center justify-between">
          <h2 class="text-base sm:text-lg font-black text-stone-800 flex items-center gap-2.5">
            <i class="fa-solid fa-palette text-orange-600"></i>
            <span>堂會專屬代表色系與 Logo 自訂</span>
          </h2>
          <span class="text-[10px] font-bold text-orange-800 bg-orange-100 px-3 py-1 rounded-full">Branding</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
          <div>
            <label class="text-stone-600 font-bold block mb-1.5">目標堂會</label>
            <select id="configChurchTarget" onchange="loadChurchConfigInputs()" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-bold focus:outline-none">
              <option value="SHiNE">火樂教會 (SHiNE)</option>
              <option value="M+">Ｍ＋大雅教會</option>
            </select>
          </div>
          <div>
            <label class="text-stone-600 font-bold block mb-1.5">主代表色</label>
            <div class="flex gap-2">
              <input type="color" id="configColorPicker" onchange="document.getElementById('configColorText').value=this.value" class="w-11 h-11 bg-transparent border-0 cursor-pointer rounded-xl">
              <input type="text" id="configColorText" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-mono uppercase focus:outline-none">
            </div>
          </div>
          <div>
            <label class="text-stone-600 font-bold block mb-1.5">Logo 圖片網址 (URL)</label>
            <input type="text" id="configLogoUrl" placeholder="https://..." class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 focus:outline-none">
          </div>
        </div>
        <div class="flex justify-end pt-2">
          <button onclick="saveChurchBranding()" class="py-2.5 px-6 rounded-xl btn-warm text-xs font-bold">儲存視覺風格</button>
        </div>
      </div>

      <!-- 管理員名單與權限指派 -->
      <div class="lux-card p-6 sm:p-8 space-y-5">
        <div class="flex justify-between items-center border-b border-stone-200/80 pb-3.5">
          <h2 class="text-base sm:text-lg font-black text-stone-800 flex items-center gap-2.5">
            <i class="fa-solid fa-user-shield text-orange-600"></i>
            <span>管理員名冊與模組權限授權中心</span>
          </h2>
          <button onclick="openAdminModal()" class="py-2.5 px-4 rounded-xl btn-warm text-xs font-bold flex items-center gap-1.5">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>指派新管理員</span>
          </button>
        </div>
        <div id="adminUsersCardsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5"></div>
      </div>

    </section>

  </main>

  <!-- 底部微浮現代晶透導覽列 (Floating Crystal Dock) -->
  <nav class="fixed bottom-5 inset-x-4 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2 max-w-md w-full lux-dock rounded-3xl z-30 px-4 py-2.5 flex justify-around">
    <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center gap-1 transition-all text-orange-600">
      <i class="fa-solid fa-users text-sm"></i>
      <span class="text-[10px] font-extrabold">會友</span>
    </button>
    <button onclick="switchTab('services')" id="nav-services" class="flex flex-col items-center gap-1 text-stone-400 hover:text-stone-700 transition-all">
      <i class="fa-solid fa-hand-holding-heart text-sm"></i>
      <span class="text-[10px] font-extrabold">服事</span>
    </button>
    <button onclick="switchTab('groups')" id="nav-groups" class="flex flex-col items-center gap-1 text-stone-400 hover:text-stone-700 transition-all">
      <i class="fa-solid fa-people-roof text-sm"></i>
      <span class="text-[10px] font-extrabold group-term-label">小家</span>
    </button>
    <button onclick="switchTab('prayers')" id="nav-prayers" class="flex flex-col items-center gap-1 text-stone-400 hover:text-stone-700 transition-all">
      <i class="fa-solid fa-hands-praying text-sm"></i>
      <span class="text-[10px] font-extrabold">代禱</span>
    </button>
    <button onclick="switchTab('superadmin')" id="nav-superadmin" class="flex flex-col items-center gap-1 text-stone-400 hover:text-stone-700 transition-all hidden">
      <i class="fa-solid fa-screwdriver-wrench text-sm"></i>
      <span class="text-[10px] font-extrabold">權限</span>
    </button>
  </nav>

  <!-- ======================== 彈窗 MODALS ======================== -->

  <!-- 【Modal: 主日服事 建立與編輯】 -->
  <div id="serviceEditModal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="lux-modal w-full sm:max-w-xl rounded-t-[36px] sm:rounded-3xl p-6 sm:p-8 space-y-5 max-h-[88vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-stone-200/80 pb-3.5">
        <h3 class="text-lg font-black text-stone-800 flex items-center gap-2" id="serviceModalTitle">
          <i class="fa-solid fa-hand-holding-heart text-orange-600"></i>
          <span>編輯主日服事安排</span>
        </h3>
        <button onclick="closeServiceModal()" class="w-8 h-8 rounded-full bg-stone-100 text-stone-500 hover:text-stone-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="editServiceId">
      
      <div class="space-y-4 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-stone-600 font-bold block mb-1.5">主日日期 *</label>
            <input type="text" id="svcDate" placeholder="例如：2027/04/11" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-bold focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div>
            <label class="text-stone-600 font-bold block mb-1.5">特別活動 / 節日</label>
            <input type="text" id="svcEvent" placeholder="如：復活節、浸禮主日" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
        </div>

        <div>
          <label class="text-stone-600 font-bold block mb-1.5">主日講員</label>
          <input type="text" id="svcSpeaker" placeholder="如：吳俊璋牧師" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-bold focus:outline-none focus:ring-2 focus:ring-orange-400">
        </div>

        <!-- 樂團同工配置 -->
        <div class="p-4 rounded-2xl bg-amber-50/60 border border-amber-200/60 space-y-3">
          <span class="text-xs font-black text-amber-900 block flex items-center gap-1.5">
            <i class="fa-solid fa-music text-orange-600"></i> 敬拜樂團同工配置
          </span>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-stone-600 text-[11px] font-bold block mb-1">敬拜主領</label>
              <select id="svcLeader" class="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-stone-800 font-semibold focus:outline-none"></select>
            </div>
            <div>
              <label class="text-stone-600 text-[11px] font-bold block mb-1">敬拜歌者</label>
              <input type="text" id="svcSingers" placeholder="歌者名單" class="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-stone-800 focus:outline-none">
            </div>
            <div>
              <label class="text-stone-600 text-[11px] font-bold block mb-1">司琴鍵盤</label>
              <select id="svcKeyboard" class="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-stone-800 font-semibold focus:outline-none"></select>
            </div>
            <div>
              <label class="text-stone-600 text-[11px] font-bold block mb-1">吉他手</label>
              <select id="svcGuitar" class="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-stone-800 font-semibold focus:outline-none"></select>
            </div>
            <div>
              <label class="text-stone-600 text-[11px] font-bold block mb-1">貝斯手</label>
              <select id="svcBass" class="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-stone-800 font-semibold focus:outline-none"></select>

  <script>
    const SUPABASE_URL = "https://vpysepgvweabioklppda.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6Uhqw7j8vLSuI9nOqsFVzA_YYRXfrjL";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let activeChurch = "SHiNE";
    let cachedChurches = {};
    let cachedMembers = [];
    let cachedGroups = [];
    let cachedServices = [];
    let cachedAdmins = [];
    let activeManagingGroup = null;

    const MINISTRY_OPTIONS = [
      "敬拜主領", "敬拜歌者", "司琴鍵盤", "木吉他", "電吉他", "Bass手", 
      "爵士鼓手", "音控PA", "直播導播", "投影簡報", "主日招待", 
      "主日學大童班", "主日學幼兒班", "青少輔導", "總務愛筵", "關懷代禱"
    ];
    let selectedMinistries = new Set();

    function getChurchTerms(churchId) {
      return churchId === 'SHiNE' 
        ? { group: '小家', leader: '小家長', member: '小家成員' }
        : { group: '小組', leader: '小組長', member: '小組組員' };
    }

    function updateDynamicTerms(churchId) {
      const terms = getChurchTerms(churchId);
      document.querySelectorAll('.group-term-label').forEach(el => el.innerText = terms.group);
      document.querySelectorAll('.group-leader-term-label').forEach(el => el.innerText = terms.leader);
      document.querySelectorAll('.group-member-term-label').forEach(el => el.innerText = terms.member);
    }

    async function handleAuthLogin() {
      const name = document.getElementById('loginNameSelect').value.trim();
      const pwd = document.getElementById('loginPwd').value.trim();
      const err = document.getElementById('loginError');

      const { data } = await db.from('admin_users').select('*').eq('name', name).eq('password', pwd).eq('is_active', true);
      if (!data || !data.length) {
        err.querySelector('span').innerText = "驗證密碼錯誤，請重新確認！";
        err.classList.remove('hidden');
        return;
      }

      currentUser = data[0];
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('currentUserLabel').innerText = `目前同工：${currentUser.name}`;

      await loadChurchesConfig();

      if (currentUser.role === 'SUPER_ADMIN') {
        document.getElementById('superChurchSelectorWrapper').classList.remove('hidden');
        document.getElementById('nav-superadmin').classList.remove('hidden');
        document.getElementById('adminRoleBadge').innerText = "SUPER ADMIN";
        activeChurch = "SHiNE";
      } else {
        document.getElementById('superChurchSelectorWrapper').classList.add('hidden');
        document.getElementById('nav-superadmin').classList.add('hidden');
        document.getElementById('adminRoleBadge').innerText = "CHURCH ADMIN";
        activeChurch = currentUser.assigned_church || "SHiNE";
      }

      applyChurchTheme(activeChurch);
      updateDynamicTerms(activeChurch);
      applyPermissions();
      loadChurchData();
    }

    async function loadChurchesConfig() {
      const { data } = await db.from('churches').select('*');
      if (data) data.forEach(c => cachedChurches[c.id] = c);
    }

    function applyChurchTheme(churchId) {
      const c = cachedChurches[churchId];
      if (!c) return;
      document.getElementById('currentChurchLabel').innerText = c.name;
      const logoImg = document.getElementById('churchLogoImg');
      const logoIcon = document.getElementById('churchLogoIcon');
      if (c.logo_url) {
        logoImg.src = c.logo_url;
        logoImg.classList.remove('hidden');
        logoIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoIcon.classList.remove('hidden');
      }
    }

    function applyPermissions() {
      if (currentUser.role === 'SUPER_ADMIN') return;
      if (!currentUser.can_manage_members) document.getElementById('nav-members').classList.add('hidden');
      if (!currentUser.can_manage_schedules) document.getElementById('nav-services').classList.add('hidden');
      if (!currentUser.can_manage_attendance) document.getElementById('nav-groups').classList.add('hidden');
      if (!currentUser.can_manage_prayers) document.getElementById('nav-prayers').classList.add('hidden');
    }

    async function loadChurchData() {
      await loadGroups();   // 先載入正式小家/小組清單
      await loadMembers();  // 再載入會友並完成清爽下拉選單
      await loadServices();
      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_prayers) loadPrayers();
      if (currentUser.role === 'SUPER_ADMIN') {
        loadAdminUsersList();
        loadChurchConfigInputs();
      }

      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_members) switchTab('members');
      else if (currentUser.can_manage_schedules) switchTab('services');
    }

    // 1. 會友名冊 (奢華流暢卡片流，含獨立 memo 呈現)
    async function loadMembers() {
      const { data } = await db.from('members').select('*').eq('church_id', activeChurch).order('id');
      cachedMembers = data || [];
      renderMembersCards(cachedMembers);
      populateGroupFilterDropdown();
    }

    function renderMembersCards(list) {
      const container = document.getElementById('memberCardsStream');
      if (!list.length) {
        container.innerHTML = `<div class="col-span-full py-16 text-center text-stone-400 text-xs">查無名冊資料</div>`;
        return;
      }
      container.innerHTML = list.map(m => {
        const hasLine = m.line_id && m.line_id.startsWith('U');
        const ministries = m.ministry ? m.ministry.split(',').map(s => s.trim()).filter(Boolean) : [];
        return `
          <div class="lux-card p-5 space-y-4 flex flex-col justify-between">
            <div class="space-y-3">
              <div class="flex justify-between items-start">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl ${m.gender === '姊妹' ? 'bg-rose-100 text-rose-700' : 'bg-orange-100 text-orange-800'} flex items-center justify-center font-extrabold text-sm shadow-sm">
                    ${m.name.slice(0, 1)}
                  </div>
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="font-black text-stone-800 text-base">${m.name}</span>
                      <span class="text-[11px] text-stone-400">(${m.gender})</span>
                      ${hasLine ? '<i class="fa-brands fa-line text-emerald-500 text-xs" title="已綁定 LINE"></i>' : ''}
                    </div>
                    <p class="text-xs text-stone-500 font-mono mt-0.5">${m.phone || '未登記電話'}</p>
                  </div>
                </div>
                <span class="text-[11px] font-bold px-3 py-1 rounded-xl bg-stone-100 text-stone-700 border border-stone-200/80">
                  ${m.group_name || '未編組'}
                </span>
              </div>

              <!-- 標籤雲：成熟度、區域、恩賜 -->
              <div class="flex flex-wrap gap-1.5 items-center pt-1">
                <span class="text-[10px] px-2 py-0.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200/60 font-semibold">${m.faith_status || '委身家人'}</span>
                ${m.district ? `<span class="text-[10px] px-2 py-0.5 rounded-lg bg-stone-100 text-stone-600 font-medium">${m.district}</span>` : ''}
                ${ministries.map(item => `<span class="text-[10px] px-2 py-0.5 rounded-lg bg-orange-100 text-orange-900 font-bold">${item}</span>`).join('')}
              </div>

              <!-- 獨立備註便利貼展示 (若有備註才出現) -->
              ${m.memo ? `
                <div class="p-2.5 rounded-xl bg-stone-100/70 border border-stone-200/60 text-[11px] text-stone-600 flex items-start gap-2">
                  <i class="fa-regular fa-note-sticky text-amber-600 mt-0.5 flex-shrink-0"></i>
                  <span class="line-clamp-2 leading-relaxed">${m.memo}</span>
                </div>
              ` : ''}
            </div>

            <div class="pt-3 border-t border-stone-200/80 flex items-center justify-between">

              <div class="flex gap-2">

    function filterMembers() {
      const q = document.getElementById('memberSearch').value.toLowerCase();
      const filterGrp = document.getElementById('memberFilterGroupSelect').value;
      const filtered = cachedMembers.filter(m => {
        const matchesQ = (m.name && m.name.toLowerCase().includes(q)) || 
                         (m.phone && m.phone.includes(q)) ||
                         (m.memo && m.memo.toLowerCase().includes(q));
        const matchesGrp = filterGrp === 'ALL' || m.group_name === filterGrp;
        return matchesQ && matchesGrp;
      });
      renderMembersCards(filtered);
    }

      const recommended = cachedMembers.filter(m => m.ministry && m.ministry.includes(targetKeyword));
      const others = cachedMembers.filter(m => !m.ministry || !m.ministry.includes(targetKeyword));

      if (recommended.length) {
        html += `<optgroup label="🌟 推薦具恩賜同工">` + recommended.map(m => `<option value="${m.name}" ${m.name===currentValue?'selected':''}>${m.name} (${m.group_name})</option>`).join('') + `</optgroup>`;

      html += `<optgroup label="全部名單">` + others.map(m => `<option value="${m.name}" ${m.name===currentValue?'selected':''}>${m.name}</option>`).join('') + `</optgroup>`;
      select.innerHTML = html;

    async function saveGroupData() {
      const id = document.getElementById('editGroupId').value;
      const name = document.getElementById('grpName').value.trim();
      const leader = document.getElementById('grpLeaderSelect').value;
      if (!name || !leader) return alert('名稱與負責同工為必填！');

      const payload = {
        church_id: activeChurch, name: name, leader: leader,
        meeting_time: document.getElementById('grpTimeSelect').value,
        location: document.getElementById('grpLocationSelect').value
      };

      if (id) {
        const oldGrp = cachedGroups.find(x => x.id === parseInt(id));
        if (oldGrp && oldGrp.name !== name) {
          await db.from('members').update({ group_name: name }).eq('church_id', activeChurch).eq('group_name', oldGrp.name);
        }
        await db.from('groups').update(payload).eq('id', id);

        await db.from('groups').insert([payload]);

      closeGroupEditModal();
      await loadGroups();
      await loadMembers();

      const logo = document.getElementById('configLogoUrl').value.trim();
      await db.from('churches').update({ primary_color: color, logo_url: logo }).eq('id', target);
      alert('✨ 堂會視覺風格配置已成功更新！');
      await loadChurchesConfig();
      applyChurchTheme(activeChurch);
    }

    async function loadAdminUsersList() {
      const { data } = await db.from('admin_users').select('*').order('id');
      cachedAdmins = data || [];
      const container = document.getElementById('adminUsersCardsList');
      container.innerHTML = cachedAdmins.map(u => `
        <div class="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between text-xs">
          <div>
            <div class="flex items-center gap-2">
              <span class="font-black text-stone-800 text-sm">${u.name}</span>
              <span class="text-[10px] px-2.5 py-0.5 rounded-full font-bold ${u.assigned_church === 'SHiNE' ? 'bg-rose-100 text-rose-800' : u.assigned_church === 'M+' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}">
                ${u.assigned_church ? (u.assigned_church === 'SHiNE' ? '火樂' : 'M+') : '超級全堂'}
              </span>
            </div>
            <p class="text-xs text-stone-500 mt-1">權限：${[u.can_manage_members && '名冊', u.can_manage_schedules && '服事', u.can_manage_attendance && '小家', u.can_manage_prayers && '代禱'].filter(Boolean).join('、') || '無'}</p>
          </div>
          <div class="flex gap-1.5">
            ${u.role !== 'SUPER_ADMIN' ? `
              <button onclick="editAdminUser(${u.id})" class="px-3 py-1.5 rounded-xl bg-white text-stone-700 shadow-sm font-bold"><i class="fa-solid fa-pen mr-1"></i>編輯</button>
              <button onclick="deleteAdminUser(${u.id}, '${u.name}')" class="px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-600 shadow-sm font-bold"><i class="fa-solid fa-trash"></i></button>
            ` : '<span class="text-xs text-stone-400 font-bold">最高權限</span>'}
          </div>
        </div>
      `).join('');
    }

    function openAdminModal() {
      document.getElementById('adminEditId').value = '';
      document.getElementById('admName').value = '';
      document.getElementById('admPwd').value = '';
      document.getElementById('pwdHint').classList.add('hidden');
      document.getElementById('permMembers').checked = true;
      document.getElementById('permSchedules').checked = true;
      document.getElementById('permAttendance').checked = true;
      document.getElementById('permPrayers').checked = true;
      document.getElementById('adminModalTitle').querySelector('span').innerText = '指派新管理員';
      document.getElementById('adminUserModal').classList.remove('hidden');
    }

    function editAdminUser(id) {
      const u = cachedAdmins.find(x => x.id === id);
      if (!u) return;
      document.getElementById('adminEditId').value = u.id;
      document.getElementById('admName').value = u.name;
      document.getElementById('admPwd').value = '';
      document.getElementById('pwdHint').classList.remove('hidden');
      document.getElementById('admChurch').value = u.assigned_church || 'SHiNE';
      document.getElementById('permMembers').checked = !!u.can_manage_members;
      document.getElementById('permSchedules').checked = !!u.can_manage_schedules;
      document.getElementById('permAttendance').checked = !!u.can_manage_attendance;
      document.getElementById('permPrayers').checked = !!u.can_manage_prayers;
      document.getElementById('adminModalTitle').querySelector('span').innerText = `編輯同工：${u.name}`;
      document.getElementById('adminUserModal').classList.remove('hidden');
    }

    function closeAdminModal() { document.getElementById('adminUserModal').classList.add('hidden'); }

    async function saveAdminUser() {
      const id = document.getElementById('adminEditId').value;
      const name = document.getElementById('admName').value.trim();
      const pwd = document.getElementById('admPwd').value.trim();
      const church = document.getElementById('admChurch').value;

      if (!name) return alert('姓名不得為空！');
      if (!id && !pwd) return alert('新增必須設定授權碼！');

      const payload = {
        name: name, assigned_church: church,
        can_manage_members: document.getElementById('permMembers').checked,
        can_manage_schedules: document.getElementById('permSchedules').checked,
        can_manage_attendance: document.getElementById('permAttendance').checked,
        can_manage_prayers: document.getElementById('permPrayers').checked
      };
      if (pwd) payload.password = pwd;

      if (id) await db.from('admin_users').update(payload).eq('id', id);
      else { payload.role = 'CHURCH_ADMIN'; await db.from('admin_users').insert([payload]); }

      closeAdminModal();
      loadAdminUsersList();
    }

    async function deleteAdminUser(id, name) {
      if (!confirm(`確定移除【${name}】的管理員資格？`)) return;
      await db.from('admin_users').delete().eq('id', id);
      loadAdminUsersList();
    }

    function switchChurch(churchId) {
      activeChurch = churchId;
      applyChurchTheme(churchId);
      updateDynamicTerms(churchId);
      loadChurchData();
    }

    function switchTab(tabId) {
      ['members', 'services', 'groups', 'prayers', 'superadmin'].forEach(t => {
        const el = document.getElementById(`mod-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (el) el.classList.add('hidden');
        if (nav) {
          nav.classList.remove('text-orange-600');
          nav.classList.add('text-stone-400');
        }
      });
      const targetEl = document.getElementById(`mod-${tabId}`);
      const targetNav = document.getElementById(`nav-${tabId}`);
      if (targetEl) targetEl.classList.remove('hidden');
      if (targetNav) {
        targetNav.classList.remove('text-stone-400');
        targetNav.classList.add('text-orange-600');
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('loginPwd').value = '';
    }
  </script>
</body>
</html>
