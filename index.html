<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHURCH OS · 智慧教牧行政治理平台</title>
  
  <!-- Tailwind CSS & Supabase & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- 頂級人文字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --brand-accent: #f97316;
      --brand-accent-hover: #ea580c;
      --brand-subtle: #ffedd5;
      --card-bg: rgba(255, 255, 255, 0.94);
      --card-border: rgba(234, 218, 198, 0.75);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(120% 80% at 50% -10%, #FFF2E2 0%, #FAF6F0 50%, #F5EEE6 100%);
      color: #1c1917;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }

    .lux-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 32px -4px rgba(184, 134, 76, 0.08), 0 4px 12px -2px rgba(184, 134, 76, 0.04);
      border-radius: 24px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lux-card:hover {
      box-shadow: 0 20px 40px -4px rgba(184, 134, 76, 0.12), 0 6px 16px -2px rgba(184, 134, 76, 0.06);
      transform: translateY(-2px);
    }

    .lux-card-newcomer {
      background: linear-gradient(135deg, rgba(255,247,237,0.95) 0%, rgba(255,255,255,0.96) 100%);
      border: 2px solid rgba(249, 115, 22, 0.45);
      box-shadow: 0 16px 36px -4px rgba(249, 115, 22, 0.15), 0 4px 12px -2px rgba(249, 115, 22, 0.08);
      border-radius: 24px;
      position: relative;
    }

    .lux-header {
      background: rgba(250, 246, 240, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(234, 218, 198, 0.8);
    }

    .lux-dock {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(234, 218, 198, 0.85);
      box-shadow: 0 20px 40px -10px rgba(120, 75, 25, 0.14);
    }

    .lux-modal {
      background: #FFFFFF;
      border: 1px solid rgba(234, 218, 198, 0.9);
      box-shadow: 0 30px 60px -12px rgba(100, 50, 10, 0.2);
    }

    .chip-item {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }
    .chip-item.active {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%) !important;
      color: #ffffff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
      transform: translateY(-1px);
    }

    .btn-warm {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      box-shadow: 0 6px 18px -2px rgba(234, 88, 12, 0.38);
      transition: all 0.25s ease;
    }
    .btn-warm:hover {
      box-shadow: 0 10px 24px -2px rgba(234, 88, 12, 0.48);
      transform: translateY(-1px);
    }
    .btn-warm:active { transform: scale(0.98); }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      header, nav, button, .no-print { display: none !important; }
      .lux-card, .lux-card-newcomer { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; }
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(214, 186, 155, 0.45); border-radius: 9999px; }
  </style>
</head>
<body class="flex flex-col font-sans pb-32 lg:pb-12 antialiased selection:bg-orange-200 selection:text-orange-950">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-40 lux-header px-4 sm:px-8 py-3.5 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center space-x-3.5 min-w-0">
        <div id="churchLogoWrapper" class="w-11 h-11 rounded-2xl flex-shrink-0 flex items-center justify-center text-white shadow-md shadow-orange-500/25 overflow-hidden" style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%)">
          <i id="churchLogoIcon" class="fa-solid fa-church text-base"></i>
          <img id="churchLogoImg" class="w-full h-full object-cover hidden" src="" alt="Logo">
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 id="currentChurchLabel" class="text-base sm:text-lg font-black text-stone-800 tracking-tight truncate max-w-[160px]">載入中...</h1>
            <span id="adminRoleBadge" class="text-[10px] tracking-wide px-2.5 py-0.5 rounded-full bg-amber-100/70 text-amber-900 font-bold border border-amber-200/80">同工認證</span>
          </div>
          <p id="currentUserLabel" class="text-xs text-stone-500 font-medium truncate mt-0.5">智慧教牧治理平台</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 flex-shrink-0">
        <div id="superChurchSelectorWrapper" class="hidden">
          <select id="superChurchSelector" onchange="switchChurch(this.value)" class="appearance-none bg-white/90 border border-stone-200 text-xs font-bold rounded-xl pl-3.5 pr-8 py-2 text-stone-700 cursor-pointer">
            <option value="SHiNE">火樂 (SHiNE)</option>
            <option value="M+">Ｍ＋大雅</option>
          </select>
        </div>
        <button onclick="logout()" class="w-9 h-9 rounded-xl bg-white hover:bg-rose-50 text-stone-400 hover:text-rose-600 border border-stone-200 shadow-sm flex items-center justify-center transition" title="安全登出">
          <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 登入認證彈窗 -->
  <div id="loginModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="lux-modal p-8 rounded-[32px] max-w-sm w-full space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-2xl text-white shadow-xl shadow-orange-500/30 mb-4" style="background: linear-gradient(135deg, #f97316 0%, #ea580c 100%)">
          <i class="fa-solid fa-cross"></i>
        </div>
        <h2 class="text-2xl font-black text-stone-800">歡迎回到同工之家</h2>
        <p class="text-xs text-stone-500">請選取管理者同工並輸入授權密碼</p>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <label class="text-stone-600 font-bold block mb-1.5">管理者同工</label>
          <select id="loginNameSelect" class="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 font-bold cursor-pointer">
            <option value="吳俊璋">吳俊璋 牧師</option>
            <option value="謝碧鳳">謝碧鳳 師母</option>
            <option value="松慕強">松慕強 牧師</option>
            <option value="戴國馨">戴國馨 火樂行政</option>
            <option value="文義豪">文義豪 火樂同工</option>
            <option value="曾恩茹">曾恩茹 Ｍ＋同工</option>
            <option value="邵鈺庭">邵鈺庭 Ｍ＋行政</option>
            <option value="張捷">張捷 Ｍ＋總務</option>
          </select>
        </div>
        <div>
          <label class="text-stone-600 font-bold block mb-1.5">安全授權碼</label>
          <input type="password" id="loginPwd" class="w-full bg-stone-50 border border-stone-200 rounded-2xl px-4 py-3 text-stone-800 font-semibold" placeholder="••••••••">
        </div>
        <p id="loginError" class="text-xs text-rose-600 font-bold hidden"><i class="fa-solid fa-circle-exclamation mr-1"></i><span></span></p>
        <button onclick="handleAuthLogin()" class="w-full py-3.5 rounded-2xl btn-warm font-extrabold text-xs tracking-wider uppercase flex items-center justify-center gap-2">
          <span>安全驗證登入</span> <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 主要內容區 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 sm:py-8 relative z-10">
    
    <!-- 模組一：會友名冊 -->
    <section id="mod-members" class="space-y-6 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
        <div class="flex flex-wrap items-center gap-2.5 flex-1">
          <div class="relative flex-1 min-w-[200px]">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-stone-400 text-xs"></i>
            <input type="text" id="memberSearch" oninput="filterMembers()" placeholder="搜尋姓名、電話、備註..." class="w-full bg-white/95 border border-stone-200/90 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-stone-800 shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <select id="memberFilterGroupSelect" onchange="filterMembers()" class="bg-white/95 border border-stone-200/90 rounded-2xl px-3.5 py-2.5 text-xs text-stone-700 font-semibold shadow-sm cursor-pointer">
            <option value="ALL">全部<span class="group-term-label">小家</span></option>
          </select>
          <select id="memberSortSelect" onchange="filterMembers()" class="bg-white/95 border border-stone-200/90 rounded-2xl px-3.5 py-2.5 text-xs text-stone-700 font-semibold shadow-sm cursor-pointer">
            <option value="name">排序：姓名筆畫</option>
            <option value="faith">排序：信仰成熟度</option>
            <option value="group">排序：所屬小家</option>
          </select>
          <div class="flex bg-white/95 border border-stone-200/90 rounded-2xl p-1 text-xs">
            <button onclick="setMemberViewMode('cards')" id="btnViewCards" class="px-3 py-1.5 rounded-xl font-bold btn-warm">卡片</button>
            <button onclick="setMemberViewMode('table')" id="btnViewTable" class="px-3 py-1.5 rounded-xl font-bold text-stone-600">表格</button>
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button onclick="window.print()" class="py-3 px-4 rounded-2xl bg-white border border-stone-200 text-stone-700 text-xs font-bold shadow-sm"><i class="fa-solid fa-print mr-1"></i>列印名冊</button>
          <button onclick="openMemberModal()" class="py-3 px-5 rounded-2xl btn-warm text-xs font-bold"><i class="fa-solid fa-user-plus mr-1"></i>新增會友</button>
        </div>
      </div>
      <div id="memberCardsStream"></div>
    </section>

    <!-- 模組二：主日事工服事 -->
    <section id="mod-services" class="space-y-6 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xl sm:text-2xl font-black text-stone-800">主日崇拜事工輪值</h2>
        <button onclick="openNewServiceModal()" class="py-3 px-5 rounded-2xl btn-warm text-xs font-bold"><i class="fa-solid fa-calendar-plus mr-1"></i>新增服事</button>
      </div>
      <div id="serviceCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
    </section>

    <!-- 模組三：小家行政中樞 -->
    <section id="mod-groups" class="space-y-6 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xl sm:text-2xl font-black text-stone-800"><span class="group-term-label">小家</span>行政與調配中樞</h2>
        <button onclick="openGroupEditModal()" class="py-3 px-5 rounded-2xl btn-warm text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>新增</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="groupCardsGrid"></div>
    </section>

    <!-- 模組四：空間資源治理 -->
    <section id="mod-spaces" class="space-y-6 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-xl sm:text-2xl font-black text-stone-800"><i class="fa-solid fa-door-open text-orange-600 mr-2"></i>空間預約與審批</h2>
        <div class="flex gap-2">
          <button onclick="switchSpaceSubTab('rooms')" id="btn-sp-rooms" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold btn-warm">空間清單</button>
          <button onclick="switchSpaceSubTab('bookings')" id="btn-sp-bookings" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-stone-600">預約審批</button>
          <button onclick="openRoomEditModal()" class="py-2 px-4 rounded-xl bg-orange-100 text-orange-950 text-xs font-extrabold">新增空間</button>
        </div>
      </div>
      <div id="sub-sp-rooms" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="sub-sp-bookings" class="space-y-4 hidden">
        <div id="bookingsListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- 模組五：牧養代禱關懷 -->
    <section id="mod-prayers" class="space-y-6 hidden">
      <h2 class="text-xl sm:text-2xl font-black text-stone-800">即時牧養關懷代禱</h2>
      <div id="prayerCardsList" class="space-y-3"></div>
    </section>

    <!-- 模組六：LINE 教牧推播與通知中心 -->
    <section id="mod-pastoral-bot" class="space-y-6 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-black text-stone-800">LINE 教牧推播與通知中心</h2>
          <p class="text-xs text-stone-500 mt-1">設定新朋友即時推播、祝禱範本、金句卡庫與祝福圖卡庫</p>
        </div>
        <div class="flex flex-wrap gap-1.5 p-1 bg-white/80 rounded-2xl border border-stone-200">
          <button onclick="switchBotSubTab('newcomer-notify')" id="btn-sub-newcomer-notify" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold btn-warm">🌱 新朋友推播</button>
          <button onclick="switchBotSubTab('templates')" id="btn-sub-templates" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-stone-600">祝禱範本</button>
          <button onclick="switchBotSubTab('cards')" id="btn-sub-cards" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-stone-600">金句卡庫</button>
          <button onclick="switchBotSubTab('images')" id="btn-sub-images" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-stone-600">🖼️ 祝福圖卡庫</button>
        </div>
      </div>

      <!-- 子面板 1: 新朋友推播設定 -->
      <div id="sub-newcomer-notify" class="space-y-4">
        <div class="lux-card p-6 sm:p-8 space-y-4">
          <h3 class="font-black text-stone-800 text-base flex items-center gap-2">
            <i class="fa-solid fa-paper-plane text-orange-600"></i>
            <span>設定新朋友填寫表單時的 LINE 即時通知接收對象</span>
          </h3>
          <p class="text-xs text-stone-500 leading-relaxed">
            當有新朋友在 LINE 填寫「遇見你真好」表單送出時，系統將自動把新朋友名片卡即時推播給以下指定的牧者或同工。
          </p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs pt-2">
            <div>
              <label class="font-bold text-stone-600 block mb-1">指定接收通知的同工姓名</label>
              <input type="text" id="notifyPastorName" placeholder="例如：吳俊璋牧師" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-bold focus:outline-none">
            </div>
            <div>
              <label class="font-bold text-stone-600 block mb-1">接收者 LINE User ID (`Uxxxx...`)</label>
              <input type="text" id="notifyPastorLineId" placeholder="例如：U1234567890abcdef..." class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-800 font-mono text-[11px] focus:outline-none">
            </div>
          </div>
          <div class="flex justify-end pt-3">
            <button onclick="saveNewcomerNotifySettings()" class="py-2.5 px-6 rounded-xl btn-warm text-xs font-bold shadow-sm">儲存推播接收設定</button>
          </div>
        </div>
      </div>

      <!-- 子面板 2: 祝禱範本 -->
      <div id="sub-templates" class="space-y-4 hidden">
        <div id="templatesListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- 子面板 3: 金句卡庫 -->
      <div id="sub-cards" class="space-y-4 hidden">
        <div class="flex justify-end">
          <button onclick="openNewCardModal()" class="py-2.5 px-4 rounded-xl btn-warm text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i>新增金句卡</button>
        </div>
        <div id="cardsListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- 子面板 4: 祝福圖卡庫 (多圖) -->
      <div id="sub-images" class="space-y-4 hidden">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-stone-600">把愛傳出去祝福圖卡管理庫</span>
          <button onclick="openNewGreetingCardModal()" class="py-2.5 px-4 rounded-xl btn-warm text-xs font-bold"><i class="fa-solid fa-cloud-arrow-up mr-1"></i>上傳新增圖卡</button>
        </div>
        <div id="greetingCardsGridContainer" class="grid grid-cols-1 md:grid-cols-3 gap-5"></div>
      </div>
    </section>

    <!-- 模組七：超級管理員控制台 -->
    <section id="mod-superadmin" class="space-y-6 hidden">
      <div class="lux-card p-6 sm:p-8 space-y-5">
        <h2 class="text-base font-black text-stone-800">堂會代表色與 Logo</h2>
        <div class="grid grid-cols-3 gap-4 text-xs">
          <select id="configChurchTarget" onchange="loadChurchConfigInputs()" class="bg-stone-50 border border-stone-200 rounded-xl p-3 font-bold">
            <option value="SHiNE">火樂教會 (SHiNE)</option>
            <option value="M+">Ｍ＋大雅教會</option>
          </select>
          <input type="text" id="configColorText" class="bg-stone-50 border border-stone-200 rounded-xl p-3 font-mono">
          <input type="text" id="configLogoUrl" placeholder="Logo URL" class="bg-stone-50 border border-stone-200 rounded-xl p-3">
        </div>
        <div class="flex justify-end"><button onclick="saveChurchBranding()" class="py-2 px-6 rounded-xl btn-warm text-xs font-bold">儲存</button></div>
      </div>
    </section>

  </main>

  <!-- 底部導覽列 -->
  <nav class="fixed bottom-5 inset-x-4 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2 max-w-xl w-full lux-dock rounded-3xl z-30 px-3 py-2.5 flex justify-around">
    <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center gap-1 text-orange-600"><i class="fa-solid fa-users text-sm"></i><span class="text-[10px] font-extrabold">會友</span></button>
    <button onclick="switchTab('services')" id="nav-services" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-hand-holding-heart text-sm"></i><span class="text-[10px] font-extrabold">服事</span></button>
    <button onclick="switchTab('groups')" id="nav-groups" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-people-roof text-sm"></i><span class="text-[10px] font-extrabold group-term-label">小家</span></button>
    <button onclick="switchTab('spaces')" id="nav-spaces" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-door-open text-sm"></i><span class="text-[10px] font-extrabold">空間</span></button>
    <button onclick="switchTab('prayers')" id="nav-prayers" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-hands-praying text-sm"></i><span class="text-[10px] font-extrabold">代禱</span></button>
    <button onclick="switchTab('pastoral-bot')" id="nav-pastoral-bot" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-paper-plane text-sm"></i><span class="text-[10px] font-extrabold">推播</span></button>
    <button onclick="switchTab('superadmin')" id="nav-superadmin" class="flex flex-col items-center gap-1 text-stone-400 hidden"><i class="fa-solid fa-screwdriver-wrench text-sm"></i><span class="text-[10px] font-extrabold">權限</span></button>
  </nav>

  <!-- 彈窗 Modals 省略不變，保留基礎結構 -->
  <div id="roomEditModal" class="fixed inset-0 bg-stone-900/50 z-50 hidden flex items-center justify-center p-4">
    <div class="lux-modal w-full max-w-md rounded-3xl p-6 space-y-4">
      <h3 class="font-black text-stone-800">編輯空間</h3>
      <input type="hidden" id="editRoomId">
      <input type="text" id="rmName" placeholder="空間名稱" class="w-full bg-stone-50 border rounded-xl p-3 text-xs">
      <div class="flex justify-end gap-2"><button onclick="closeRoomEditModal()" class="px-4 py-2 bg-stone-100 text-xs font-bold rounded-xl">取消</button><button onclick="saveRoomData()" class="px-6 py-2 btn-warm text-xs font-bold rounded-xl">儲存</button></div>
    </div>
  </div>

  <div id="memberEditModal" class="fixed inset-0 bg-stone-900/50 z-50 hidden flex items-center justify-center p-4">
    <div class="lux-modal w-full max-w-lg rounded-3xl p-6 space-y-4 max-h-[85vh] overflow-y-auto">
      <h3 class="font-black text-stone-800">編輯會友名冊</h3>
      <input type="hidden" id="editMemberId">
      <div class="space-y-3 text-xs">
        <div><label class="font-bold">姓名</label><input type="text" id="editName" class="w-full bg-stone-50 border rounded-xl p-2.5"></div>
        <div><label class="font-bold">電話</label><input type="tel" id="editPhone" class="w-full bg-stone-50 border rounded-xl p-2.5"></div>
        <div><label class="font-bold">信仰成熟度</label><select id="editFaithStatus" class="w-full bg-stone-50 border rounded-xl p-2.5"><option value="新朋友（初次聚會）">新朋友（初次聚會）</option><option value="慕道友（偶爾出現）">慕道友（偶爾出現）</option><option value="受洗初信">受洗初信</option><option value="委身家人（穩定聚會）">委身家人（穩定聚會）</option><option value="門徒">門徒</option><option value="領袖">領袖</option></select></div>
        <div><label class="font-bold">服事恩賜標籤</label><div id="ministryChipsContainer" class="flex flex-wrap gap-1.5 pt-1"></div></div>
        <div><label class="font-bold">備註</label><textarea id="editMemo" rows="2" class="w-full bg-stone-50 border rounded-xl p-2.5"></textarea></div>
      </div>
      <div class="flex justify-end gap-2 pt-2"><button onclick="closeMemberModal()" class="px-4 py-2 bg-stone-100 text-xs font-bold rounded-xl">取消</button><button onclick="saveMemberFromModal()" class="px-6 py-2 btn-warm text-xs font-bold rounded-xl">確認儲存</button></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vpysepgvweabioklppda.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6Uhqw7j8vLSuI9nOqsFVzA_YYRXfrjL";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let activeChurch = "SHiNE";
    let cachedMembers = [];
    let cachedTemplates = [];
    let cachedGreetingCards = [];
    let memberViewMode = "cards";

    const MINISTRY_OPTIONS = [
      "敬拜主領", "敬拜歌者", "司琴鍵盤", "木吉他", "電吉他", "Bass手", 
      "爵士鼓手", "音控PA", "直播導播", "投影簡報", "主日招待", 
      "兒童主日學老師", "學青輔導", "總務愛筵", "關懷代禱",
      "網站管理", "社群媒體小編", "小組長", "美編設計",
      "司會報告", "主日禱告", "接送同工", "聖餐事奉"
    ];
    let selectedMinistries = new Set();

    window.addEventListener('DOMContentLoaded', async () => {
      const savedUserStr = localStorage.getItem('church_os_current_user');
      const savedChurch = localStorage.getItem('church_os_active_church');
      if (savedUserStr) {
        try {
          currentUser = JSON.parse(savedUserStr);
          document.getElementById('loginModal').classList.add('hidden');
          document.getElementById('currentUserLabel').innerText = `目前同工：${currentUser.name}`;
          activeChurch = savedChurch || currentUser.assigned_church || "SHiNE";
          if (currentUser.role === 'SUPER_ADMIN') {
            document.getElementById('superChurchSelectorWrapper').classList.remove('hidden');
            document.getElementById('superChurchSelector').value = activeChurch;
          }
          loadChurchData();
        } catch(e) { localStorage.removeItem('church_os_current_user'); }
      }
    });

    async function handleAuthLogin() {
      const name = document.getElementById('loginNameSelect').value;
      const pwd = document.getElementById('loginPwd').value;
      const { data } = await db.from('admin_users').select('*').eq('name', name).eq('password', pwd).eq('is_active', true);
      if (!data || !data.length) { document.getElementById('loginError').classList.remove('hidden'); document.getElementById('loginError').querySelector('span').innerText = "密碼錯誤！"; return; }
      currentUser = data[0];
      localStorage.setItem('church_os_current_user', JSON.stringify(currentUser));
      document.getElementById('loginModal').classList.add('hidden');
      activeChurch = currentUser.assigned_church || "SHiNE";
      localStorage.setItem('church_os_active_church', activeChurch);
      loadChurchData();
    }

    async function loadChurchData() {
      loadMembers();
      loadPastoralBotSettings();
      switchTab('members');
    }

    // 會友模組
    async function loadMembers() {
      const { data } = await db.from('members').select('*').eq('church_id', activeChurch).order('id');
      cachedMembers = data || [];
      filterMembers();
    }

    function setMemberViewMode(mode) {
      memberViewMode = mode;
      filterMembers();
    }

    function filterMembers() {
      const q = document.getElementById('memberSearch').value.toLowerCase();
      const filtered = cachedMembers.filter(m => (m.name && m.name.toLowerCase().includes(q)) || (m.phone && m.phone.includes(q)));
      renderMembersView(filtered);
    }

    function renderMembersView(list) {
      const container = document.getElementById('memberCardsStream');
      if (!list.length) { container.innerHTML = `<div class="py-16 text-center text-stone-400 text-xs">查無名冊</div>`; return; }

      container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4";
      container.innerHTML = list.map(m => {
        const isNewcomer = m.faith_status === '新朋友（初次聚會）';
        const cardClass = isNewcomer ? 'lux-card-newcomer p-5 space-y-3.5 flex flex-col justify-between' : 'lux-card p-5 space-y-3.5 flex flex-col justify-between';
        return `
          <div class="${cardClass}">
            <div class="space-y-3">
              <div class="flex justify-between items-start">
                <div class="flex items-center gap-3">
                  <div class="w-11 h-11 rounded-2xl bg-orange-100 text-orange-800 flex items-center justify-center font-extrabold text-sm shadow-sm">
                    ${m.photo_url ? `<img src="${m.photo_url}" class="w-full h-full object-cover rounded-2xl">` : m.name.slice(0, 1)}
                  </div>
                  <div>
                    <span class="font-black text-stone-800 text-base">${m.name}</span>
                    <p class="text-xs text-stone-500 font-mono mt-0.5">${m.phone || '未登記'}</p>
                  </div>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 items-center pt-1">
                <span class="text-[10px] px-2 py-0.5 rounded-lg ${isNewcomer ? 'bg-orange-500 text-white font-black animate-pulse' : 'bg-amber-50 text-amber-900 font-semibold'}">
                  ${isNewcomer ? '🌱 新朋友（迎賓中）' : (m.faith_status || '委身家人')}
                </span>
              </div>
              ${isNewcomer && m.memo ? `
                <div class="p-3 rounded-2xl bg-orange-50/90 border border-orange-200 text-xs text-stone-800 space-y-1.5 shadow-sm">
                  <div class="flex items-center gap-1.5 font-black text-orange-950 text-[11px]">
                    <i class="fa-solid fa-seedling text-orange-600"></i>
                    <span>新朋友初次填寫摘要</span>
                  </div>
                  <p class="leading-relaxed font-medium text-[11px]">${m.memo}</p>
                </div>
              ` : (m.memo ? `<div class="p-2.5 rounded-xl bg-stone-100 text-[11px] text-stone-600">${m.memo}</div>` : '')}
            </div>
            <div class="pt-3 border-t flex justify-end gap-2">
              <button onclick="editMember(${m.id})" class="text-xs px-3 py-1.5 rounded-xl bg-orange-50 text-orange-800 font-bold">編輯</button>
              <button onclick="deleteMember(${m.id})" class="text-xs px-2.5 py-1.5 rounded-xl bg-rose-50 text-rose-600"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMinistryChips() {
      document.getElementById('ministryChipsContainer').innerHTML = MINISTRY_OPTIONS.map(opt => `
        <div onclick="selectedMinistries.has('${opt}') ? selectedMinistries.delete('${opt}') : selectedMinistries.add('${opt}'); renderMinistryChips();" class="chip-item px-3 py-1.5 rounded-xl text-xs font-bold border ${selectedMinistries.has(opt) ? 'active' : 'bg-stone-50'}">${opt}</div>
      `).join('');
    }

    function openMemberModal() {
      document.getElementById('editMemberId').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editPhone').value = '';
      document.getElementById('editMemo').value = '';
      selectedMinistries.clear();
      renderMinistryChips();
      document.getElementById('memberEditModal').classList.remove('hidden');
    }
    function closeMemberModal() { document.getElementById('memberEditModal').classList.add('hidden'); }

    async function editMember(id) {
      const m = cachedMembers.find(x => x.id === id);
      if (!m) return;
      document.getElementById('editMemberId').value = m.id;
      document.getElementById('editName').value = m.name;
      document.getElementById('editPhone').value = m.phone || '';
      document.getElementById('editFaithStatus').value = m.faith_status || '新朋友（初次聚會）';
      document.getElementById('editMemo').value = m.memo || '';
      selectedMinistries.clear();
      if (m.ministry) m.ministry.split(',').forEach(i => selectedMinistries.add(i.trim()));
      renderMinistryChips();
      document.getElementById('memberEditModal').classList.remove('hidden');
    }

    async function saveMemberFromModal() {
      const id = document.getElementById('editMemberId').value;
      const name = document.getElementById('editName').value.trim();
      const payload = {
        church_id: activeChurch,
        name,
        phone: document.getElementById('editPhone').value.trim(),
        faith_status: document.getElementById('editFaithStatus').value,
        ministry: Array.from(selectedMinistries).join(', '),
        memo: document.getElementById('editMemo').value.trim()
      };
      if (id) await db.from('members').update(payload).eq('id', id);
      else await db.from('members').insert([payload]);
      closeMemberModal();
      loadMembers();
    }

    async function deleteMember(id) {
      if (confirm('確定刪除？')) { await db.from('members').delete().eq('id', id); loadMembers(); }
    }

    // 教牧推播與新朋友通知設定中心
    async function loadPastoralBotSettings() {
      const { data: churchInfo } = await db.from('churches').select('*').eq('id', activeChurch).single();
      if (churchInfo) {
        document.getElementById('notifyPastorName').value = churchInfo.notify_pastor_name || '';
        document.getElementById('notifyPastorLineId').value = churchInfo.notify_pastor_line_id || '';
      }
      const { data: tpls } = await db.from('pastoral_templates').select('*').eq('church_id', activeChurch);
      cachedTemplates = tpls || [];
      document.getElementById('templatesListContainer').innerHTML = (cachedTemplates).map(t => `
        <div class="lux-card p-5 space-y-3">
          <h3 class="font-black text-sm text-stone-800">${t.title}</h3>
          <textarea id="tpl-text-${t.id}" rows="3" class="w-full bg-stone-50 border rounded-xl p-3 text-xs">${t.content}</textarea>
          <div class="flex justify-end"><button onclick="saveTemplate(${t.id})" class="px-4 py-1.5 rounded-xl btn-warm text-xs font-bold">儲存</button></div>
        </div>
      `).join('');
    }

    async function saveNewcomerNotifySettings() {
      const name = document.getElementById('notifyPastorName').value.trim();
      const lineId = document.getElementById('notifyPastorLineId').value.trim();
      await db.from('churches').update({ notify_pastor_name: name, notify_pastor_line_id: lineId }).eq('id', activeChurch);
      alert('✨ 新朋友即時推播接收設定已成功儲存！');
    }

    async function saveTemplate(id) {
      const val = document.getElementById(`tpl-text-${id}`).value.trim();
      await db.from('pastoral_templates').update({ content: val }).eq('id', id);
      alert('✨ 儲存成功！');
    }

    // 核心修復：切換推播中心子分頁
    function switchBotSubTab(tab) {
      ['newcomer-notify', 'templates', 'cards', 'images'].forEach(t => {
        const el = document.getElementById(`sub-${t}`);
        const btn = document.getElementById(`btn-sub-${t}`);
        if (el) el.classList.toggle('hidden', t !== tab);
        if (btn) btn.className = (t === tab) ? 'px-3.5 py-1.5 rounded-xl text-xs font-extrabold btn-warm' : 'px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-stone-600';
      });
    }

    function switchChurch(churchId) {
      activeChurch = churchId;
      localStorage.setItem('church_os_active_church', activeChurch);
      loadChurchData();
    }

    function switchTab(tabId) {
      ['members', 'services', 'groups', 'spaces', 'prayers', 'pastoral-bot', 'superadmin'].forEach(t => {
        document.getElementById(`mod-${t}`).classList.add('hidden');
      });
      document.getElementById(`mod-${tabId}`).classList.remove('hidden');
    }

    function logout() {
      localStorage.removeItem('church_os_current_user');
      localStorage.removeItem('church_os_active_church');
      location.reload();
    }
  </script>
</body>
</html>
