<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHURCH OS · 智慧教牧行政治理平台</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- 頂級字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --brand-primary: #6366f1;
      --brand-glow: rgba(99, 102, 241, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #080c14;
      color: #f1f5f9;
      overflow-x: hidden;
      width: 100vw;
    }

    /* 頂級晶瑩毛玻璃 */
    .glass-nav {
      background: rgba(8, 12, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .glass-card {
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glass-card:active {
      transform: scale(0.99);
    }

    .glass-modal {
      background: rgba(13, 18, 30, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 標籤 Chips 點選樣式 */
    .chip-btn {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }
    .chip-btn.selected {
      background-color: var(--brand-primary) !important;
      color: #ffffff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 14px var(--brand-glow);
    }

    /* 自訂平滑捲動條 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans pb-24 lg:pb-8">

  <!-- 頂部精雕導航列（全響應防溢出） -->
  <header class="sticky top-0 z-40 glass-nav px-3.5 sm:px-6 py-2.5 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      
      <!-- 堂會 Logo 與名稱 -->
      <div class="flex items-center space-x-2.5 min-w-0">
        <div id="churchLogoWrapper" class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl flex-shrink-0 flex items-center justify-center text-white shadow-lg overflow-hidden transition-all duration-300" style="background-color: var(--brand-primary)">
          <i id="churchLogoIcon" class="fa-solid fa-church text-sm sm:text-base"></i>
          <img id="churchLogoImg" class="w-full h-full object-cover hidden" src="" alt="Logo">
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5">
            <h1 id="currentChurchLabel" class="text-xs sm:text-sm font-bold tracking-tight text-white truncate max-w-[140px] sm:max-w-none">
              載入中...
            </h1>
            <span id="adminRoleBadge" class="text-[9px] px-1.5 py-0.5 rounded-full bg-white/[0.08] text-slate-300 font-semibold border border-white/[0.08] whitespace-nowrap">
              -
            </span>
          </div>
          <p id="currentUserLabel" class="text-[10px] text-slate-400 truncate">智慧教牧治理平台</p>
        </div>
      </div>

      <!-- 右側切換堂會與登出 -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <div id="superChurchSelectorWrapper" class="hidden">
          <select id="superChurchSelector" onchange="switchChurch(this.value)" class="bg-slate-900 border border-white/10 text-[11px] font-semibold rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none cursor-pointer">
            <option value="SHiNE">火樂 (SHiNE)</option>
            <option value="M+">Ｍ＋大雅</option>
          </select>
        </div>
        <button onclick="logout()" class="w-8 h-8 rounded-lg bg-white/[0.05] hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 border border-white/[0.06] flex items-center justify-center transition" title="登出">
          <i class="fa-solid fa-arrow-right-from-bracket text-[11px]"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- 登入認證彈窗（極致簡約防呆） -->
  <div id="loginModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
    <div class="glass-modal p-6 sm:p-8 rounded-3xl max-w-sm w-full space-y-5 shadow-2xl border border-white/10">
      <div class="text-center space-y-1.5">
        <div class="w-12 h-12 rounded-2xl mx-auto flex items-center justify-center text-lg text-white shadow-xl mb-3" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-lg font-extrabold text-white">同工權限授權登入</h2>
        <p class="text-xs text-slate-400">請選取管理者並輸入安全授權碼</p>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="text-slate-400 font-semibold block mb-1">管理者同工</label>
          <select id="loginNameSelect" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-white font-medium focus:outline-none">
            <option value="吳俊璋">吳俊璋 (主任牧師 · 超級管理)</option>
            <option value="謝碧鳳">謝碧鳳 (師母 · 超級管理)</option>
            <option value="松慕強">松慕強 (牧師 · 超級管理)</option>
            <option value="戴國馨">戴國馨 (火樂幹事 · 堂會管理)</option>
            <option value="文義豪">文義豪 (火樂同工 · 堂會管理)</option>
            <option value="曾恩茹">曾恩茹 (M+幹事 · 堂會管理)</option>
            <option value="邵鈺庭">邵鈺庭 (M+同工 · 堂會管理)</option>
          </select>
        </div>

        <div>
          <label class="text-slate-400 font-semibold block mb-1">授權密碼</label>
          <input type="password" id="loginPwd" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-white focus:outline-none" placeholder="••••••••">
        </div>

        <p id="loginError" class="text-xs text-rose-400 font-medium hidden flex items-center gap-1.5">
          <i class="fa-solid fa-circle-exclamation"></i> <span></span>
        </p>

        <button onclick="handleAuthLogin()" class="w-full py-3 rounded-xl text-white font-bold text-xs transition-all shadow-lg active:scale-95 flex items-center justify-center gap-1.5" style="background-color: var(--brand-primary)">
          <span>安全驗證登入</span>
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- 主要內容介面（全 RWD 卡片化，絕無手機破版超框） -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3.5 sm:px-6 py-4 sm:py-6">
    
    <!-- 模組一：會友名冊管理 -->
    <section id="mod-members" class="space-y-4 hidden">
      <!-- 篩選器與快速建立 -->
      <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3">
        <div class="flex items-center gap-2 flex-1">
          <div class="relative flex-1">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-500 text-xs"></i>
            <input type="text" id="memberSearch" oninput="filterMembers()" placeholder="快速搜尋姓名、電話..." class="w-full bg-slate-900/90 border border-white/10 rounded-xl pl-8 pr-3 py-2 text-xs text-white focus:outline-none">
          </div>
          <!-- 篩選小家/小組下拉 -->
          <select id="memberFilterGroupSelect" onchange="filterMembers()" class="bg-slate-900/90 border border-white/10 rounded-xl px-2.5 py-2 text-xs text-slate-300 focus:outline-none max-w-[130px]">
            <option value="ALL">全部<span class="group-term-label">小家</span></option>
          </select>
        </div>

        <button onclick="openMemberModal()" class="py-2.5 px-4 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-1.5 shadow-lg active:scale-95" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-user-plus text-[11px]"></i>
          <span>新增會友</span>
        </button>
      </div>

      <!-- 會友數據：手機採高質感卡片流，平板/電腦採多欄網格 (拒絕超框) -->
      <div id="memberCardsStream" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- 動態渲染卡片 -->
      </div>
    </section>

    <!-- 模組二：主日事工排班 -->
    <section id="mod-services" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-base sm:text-lg font-extrabold text-white">主日崇拜事工排程</h2>
          <p class="text-[11px] text-slate-400">掌握各週敬拜樂團、影音與接待輪值</p>
        </div>
      </div>
      <div id="serviceCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
    </section>

    <!-- 模組三：小家 / 小組 行政管理與人員調配 -->
    <section id="mod-groups" class="space-y-4 hidden">
      <div class="flex justify-between items-center gap-3">
        <div>
          <h2 class="text-base sm:text-lg font-extrabold text-white flex items-center gap-1.5">
            <span class="group-term-label">小家</span>行政管理中心
          </h2>
          <p class="text-[11px] text-slate-400">建立<span class="group-term-label">小家</span>、調配<span class="group-leader-term-label">小家長</span>與組員</p>
        </div>
        <button onclick="openGroupEditModal()" class="py-2 px-3.5 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95 flex items-center gap-1.5 whitespace-nowrap" style="background-color: var(--brand-primary)">
          <i class="fa-solid fa-plus text-[11px]"></i>
          <span>新增<span class="group-term-label">小家</span></span>
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5" id="groupCardsGrid"></div>
    </section>

    <!-- 模組四：代禱關懷 -->
    <section id="mod-prayers" class="space-y-4 hidden">
      <div>
        <h2 class="text-base sm:text-lg font-extrabold text-white">即時牧養關懷代禱</h2>
        <p class="text-[11px] text-slate-400">來自官方帳號回報之事項</p>
      </div>
      <div id="prayerCardsList" class="space-y-2.5"></div>
    </section>

    <!-- 模組五：超級管理員控制台 -->
    <section id="mod-superadmin" class="space-y-6 hidden">
      
      <!-- 品牌色系與 LOGO -->
      <div class="glass-card rounded-2xl p-4 sm:p-6 space-y-4">
        <div class="border-b border-white/[0.06] pb-2.5 flex items-center justify-between">
          <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-palette" style="color: var(--brand-primary)"></i>
            <span>堂會專屬視覺風格配置</span>
          </h2>
          <span class="text-[10px] font-mono text-indigo-300 bg-indigo-500/10 px-2 py-0.5 rounded-full">Branding</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
          <div>
            <label class="text-slate-400 font-medium block mb-1">目標堂會</label>
            <select id="configChurchTarget" onchange="loadChurchConfigInputs()" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white font-semibold focus:outline-none">
              <option value="SHiNE">火樂教會 (SHiNE)</option>
              <option value="M+">Ｍ＋大雅教會</option>
            </select>
          </div>

          <div>
            <label class="text-slate-400 font-medium block mb-1">主代表色</label>
            <div class="flex gap-2">
              <input type="color" id="configColorPicker" onchange="document.getElementById('configColorText').value=this.value" class="w-10 h-9 bg-transparent border-0 cursor-pointer rounded-lg">
              <input type="text" id="configColorText" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2 text-white font-mono uppercase focus:outline-none">
            </div>
          </div>

          <div>
            <label class="text-slate-400 font-medium block mb-1">Logo 圖片網址 (URL)</label>
            <input type="text" id="configLogoUrl" placeholder="https://..." class="w-full bg-slate-900 border border-white/10 rounded-xl p-2 text-white focus:outline-none">
          </div>
        </div>

        <div class="flex justify-end pt-1">
          <button onclick="saveChurchBranding()" class="py-2 px-4 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95" style="background-color: var(--brand-primary)">
            儲存風格配置
          </button>
        </div>
      </div>

      <!-- 管理員帳號與權限 -->
      <div class="glass-card rounded-2xl p-4 sm:p-6 space-y-4">
        <div class="flex justify-between items-center border-b border-white/[0.06] pb-2.5">
          <h2 class="text-sm sm:text-base font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-user-shield" style="color: var(--brand-primary)"></i>
            <span>行政管理員指派與授權中心</span>
          </h2>
          <button onclick="openAdminModal()" class="py-1.5 px-3 rounded-xl text-xs font-bold text-white shadow-md active:scale-95" style="background-color: var(--brand-primary)">
            <i class="fa-solid fa-plus mr-1"></i> 指派管理員
          </button>
        </div>

        <!-- 管理員卡片清單 (手機不破版) -->
        <div id="adminUsersCardsList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

    </section>

  </main>

  <!-- 底部微浮現代化導覽列 (Mobile 專用極致單手體驗) -->
  <nav class="fixed bottom-3 inset-x-3 sm:inset-x-auto sm:left-1/2 sm:-translate-x-1/2 max-w-md w-full glass-nav rounded-2xl z-30 px-3 py-2 flex justify-around shadow-2xl border border-white/10">
    <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center gap-0.5 transition-all" style="color: var(--brand-primary)">
      <i class="fa-solid fa-users text-sm"></i>
      <span class="text-[10px] font-medium">會友</span>
    </button>
    <button onclick="switchTab('services')" id="nav-services" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-calendar-check text-sm"></i>
      <span class="text-[10px] font-medium">排班</span>
    </button>
    <button onclick="switchTab('groups')" id="nav-groups" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-people-roof text-sm"></i>
      <span class="text-[10px] font-medium group-term-label">小家</span>
    </button>
    <button onclick="switchTab('prayers')" id="nav-prayers" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-hands-praying text-sm"></i>
      <span class="text-[10px] font-medium">代禱</span>
    </button>
    <button onclick="switchTab('superadmin')" id="nav-superadmin" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-200 hidden">
      <i class="fa-solid fa-screwdriver-wrench text-sm"></i>
      <span class="text-[10px] font-medium">權限</span>
    </button>
  </nav>

  <!-- ======================== 全新重構：零破版防呆 MODAL ======================== -->

  <!-- 【Modal 1】會友資料編輯/新增 (全面勾選化與下拉化) -->
  <div id="memberEditModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="glass-modal w-full sm:max-w-lg rounded-t-[28px] sm:rounded-3xl p-5 sm:p-6 space-y-4 max-h-[85vh] overflow-y-auto border-t sm:border border-white/10 shadow-2xl">
      <div class="flex justify-between items-center border-b border-white/[0.06] pb-2.5">
        <h3 class="text-base font-bold text-white flex items-center gap-2" id="memberModalTitle">
          <i class="fa-solid fa-user-pen" style="color: var(--brand-primary)"></i>
          <span>編輯會友資料</span>
        </h3>
        <button onclick="closeMemberModal()" class="w-8 h-8 rounded-full bg-white/[0.05] text-slate-400 hover:text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="editMemberId">
      
      <div class="space-y-3.5 text-xs">
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">會友姓名 *</label>
            <input type="text" id="editName" placeholder="輸入姓名" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">性別 (單選)</label>
            <select id="editGender" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
              <option value="弟兄">弟兄</option>
              <option value="姊妹">姊妹</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">電話號碼</label>
            <input type="tel" id="editPhone" placeholder="09xxxxxxxx" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">所屬<span class="group-term-label">小家</span> (下拉選取)</label>
            <select id="editGroupSelect" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
              <!-- 動態載入小家/小組清單 -->
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-slate-400 font-semibold block mb-1">信仰狀態 (下拉選取)</label>
            <select id="editFaithStatus" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
              <option value="委身家人">委身家人</option>
              <option value="穩定聚會(8成以上)">穩定聚會(8成以上)</option>
              <option value="初信受洗">初信受洗</option>
              <option value="慕道友">慕道友</option>
              <option value="暫停聚會/關懷中">暫停聚會/關懷中</option>
            </select>
          </div>
          <div>
            <label class="text-slate-400 font-semibold block mb-1">居住區域 (下拉選取)</label>
            <select id="editDistrict" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
              <option value="大雅區">大雅區</option>
              <option value="西屯區">西屯區</option>
              <option value="北屯區">北屯區</option>
              <option value="潭子區">潭子區</option>
              <option value="神岡區">神岡區</option>
              <option value="沙鹿區">沙鹿區</option>
              <option value="其他地區">其他地區</option>
            </select>
          </div>
        </div>

        <!-- 服事恩賜：完全免打字！點擊標籤切換勾選 -->
        <div>
          <label class="text-slate-400 font-semibold block mb-1.5">服事恩賜與事工 (點選標籤勾選，免打字)：</label>
          <div id="ministryChipsContainer" class="flex flex-wrap gap-1.5">
            <!-- 動態產生點選標籤 -->
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t border-white/[0.06]">
        <button onclick="closeMemberModal()" class="py-2.5 px-4 rounded-xl bg-white/[0.05] text-slate-300 text-xs font-semibold">取消</button>
        <button onclick="saveMemberFromModal()" class="py-2.5 px-5 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95" style="background-color: var(--brand-primary)">確認儲存</button>
      </div>
    </div>
  </div>

  <!-- 【Modal 2】小家 / 小組 編輯與建立 -->
  <div id="groupEditModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">

        <div>
          <label class="text-slate-400 font-semibold block mb-1">管轄堂會 (嚴格資料隔離) *</label>
          <select id="admChurch" class="w-full bg-slate-900 border border-white/10 rounded-xl p-2.5 text-white focus:outline-none">
            <option value="SHiNE">火樂教會 (SHiNE)</option>
            <option value="M+">Ｍ＋大雅教會</option>

        <div>

          <div class="grid grid-cols-2 gap-2 text-slate-300">
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06] cursor-pointer">
              <input type="checkbox" id="permMembers" class="rounded accent-indigo-500 w-4 h-4"> <span>會友名冊</span>

              <input type="checkbox" id="permSchedules" class="rounded accent-indigo-500 w-4 h-4"> <span>主日排班</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06] cursor-pointer">
              <input type="checkbox" id="permAttendance" class="rounded accent-indigo-500 w-4 h-4"> <span><span class="group-term-label">小家</span>管理</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06] cursor-pointer">
              <input type="checkbox" id="permPrayers" class="rounded accent-indigo-500 w-4 h-4"> <span>關懷代禱</span>

        <button onclick="saveAdminUser()" class="py-2.5 px-5 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95" style="background-color: var(--brand-primary)">確認儲存</button>

  <script>
    const SUPABASE_URL = "https://vpysepgvweabioklppda.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6Uhqw7j8vLSuI9nOqsFVzA_YYRXfrjL";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let activeChurch = "SHiNE";
    let cachedChurches = {};
    let cachedMembers = [];
    let cachedGroups = [];
    let cachedAdmins = [];
    let activeManagingGroup = null;

    // 常見服事恩賜選項庫（免手打，點選即切換）
    const MINISTRY_OPTIONS = [
      "敬拜主領", "敬拜歌者", "司琴鍵盤", "木吉他", "電吉他", "Bass手", 
      "爵士鼓手", "音控PA", "直播導播", "投影簡報", "主日招待", 
      "主日學大童班", "主日學幼兒班", "青少輔導", "總務愛筵", "關懷代禱"
    ];

    let selectedMinistries = new Set();

    // 堂會文化名詞動態切換：火樂=小家 / M+=小組
    function getChurchTerms(churchId) {
      if (churchId === 'SHiNE') {
        return { group: '小家', leader: '小家長', member: '小家成員' };
      } else {
        return { group: '小組', leader: '小組長', member: '小組組員' };
      }
    }

    function updateDynamicTerms(churchId) {
      const terms = getChurchTerms(churchId);
      document.querySelectorAll('.group-term-label').forEach(el => el.innerText = terms.group);
      document.querySelectorAll('.group-leader-term-label').forEach(el => el.innerText = terms.leader);
      document.querySelectorAll('.group-member-term-label').forEach(el => el.innerText = terms.member);
    }

    // 登入驗證
    async function handleAuthLogin() {
      const name = document.getElementById('loginNameSelect').value.trim();
      const pwd = document.getElementById('loginPwd').value.trim();
      const err = document.getElementById('loginError');

      const { data } = await db.from('admin_users').select('*').eq('name', name).eq('password', pwd).eq('is_active', true);
      
      if (!data || data.length === 0) {
        err.querySelector('span').innerText = "驗證授權密碼錯誤，請重新確認！";
        err.classList.remove('hidden');
        return;
      }

      currentUser = data[0];
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('currentUserLabel').innerText = `登入者：${currentUser.name}`;

      await loadChurchesConfig();

      if (currentUser.role === 'SUPER_ADMIN') {
        document.getElementById('superChurchSelectorWrapper').classList.remove('hidden');
        document.getElementById('nav-superadmin').classList.remove('hidden');
        document.getElementById('adminRoleBadge').innerText = "SUPER ADMIN";
        activeChurch = "SHiNE";
      } else {
        document.getElementById('superChurchSelectorWrapper').classList.add('hidden');
        document.getElementById('nav-superadmin').classList.add('hidden');
        document.getElementById('adminRoleBadge').innerText = "CHURCH ADMIN";
        activeChurch = currentUser.assigned_church || "SHiNE";
      }

      applyChurchTheme(activeChurch);
      updateDynamicTerms(activeChurch);
      applyPermissions();
      loadChurchData();
    }

    async function loadChurchesConfig() {
      const { data } = await db.from('churches').select('*');
      if (data) data.forEach(c => cachedChurches[c.id] = c);
    }

    function applyChurchTheme(churchId) {
      const c = cachedChurches[churchId];
      if (!c) return;

      document.getElementById('currentChurchLabel').innerText = c.name;
      const primary = c.primary_color || '#6366f1';
      document.documentElement.style.setProperty('--brand-primary', primary);
      document.documentElement.style.setProperty('--brand-glow', `${primary}40`);

      const logoImg = document.getElementById('churchLogoImg');
      const logoIcon = document.getElementById('churchLogoIcon');
      if (c.logo_url) {
        logoImg.src = c.logo_url;
        logoImg.classList.remove('hidden');
        logoIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoIcon.classList.remove('hidden');
      }
    }

    function applyPermissions() {
      if (currentUser.role === 'SUPER_ADMIN') return;
      if (!currentUser.can_manage_members) document.getElementById('nav-members').classList.add('hidden');
      if (!currentUser.can_manage_schedules) document.getElementById('nav-services').classList.add('hidden');
      if (!currentUser.can_manage_attendance) document.getElementById('nav-groups').classList.add('hidden');
      if (!currentUser.can_manage_prayers) document.getElementById('nav-prayers').classList.add('hidden');
    }

    async function loadChurchData() {
      await loadMembers();
      await loadGroups();
      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_schedules) loadServices();
      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_prayers) loadPrayers();
      if (currentUser.role === 'SUPER_ADMIN') {
        loadAdminUsersList();
        loadChurchConfigInputs();
      }

      if (currentUser.role === 'SUPER_ADMIN' || currentUser.can_manage_members) switchTab('members');
      else if (currentUser.can_manage_attendance) switchTab('groups');
      else if (currentUser.can_manage_schedules) switchTab('services');
    }

    // 1. 會友模組（卡片化，手機絕不超框）
    async function loadMembers() {
      const { data } = await db.from('members').select('*').eq('church_id', activeChurch).order('id');
      cachedMembers = data || [];
      renderMembersCards(cachedMembers);
      populateGroupFilterDropdown();
    }

    function renderMembersCards(list) {
      const container = document.getElementById('memberCardsStream');
      const terms = getChurchTerms(activeChurch);

      if (!list.length) {
        container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">查無符合之會友名冊</div>`;
        return;
      }

      container.innerHTML = list.map(m => {
        const hasLine = m.line_id && m.line_id.startsWith('U');
        const ministries = m.ministry ? m.ministry.split(',').map(s => s.trim()).filter(Boolean) : [];

        return `
          <div class="glass-card rounded-2xl p-3.5 space-y-2.5 flex flex-col justify-between">
            <div class="space-y-2">
              <div class="flex justify-between items-start">
                <div class="flex items-center gap-2">
                  <div class="w-9 h-9 rounded-xl ${m.gender === '姊妹' ? 'bg-rose-500/15 text-rose-300' : 'bg-indigo-500/15 text-indigo-300'} flex items-center justify-center font-bold text-sm">
                    ${m.name.slice(0, 1)}
                  </div>
                  <div>
                    <div class="flex items-center gap-1.5">
                      <span class="font-bold text-white text-sm">${m.name}</span>
                      <span class="text-[10px] text-slate-400">(${m.gender})</span>
                      ${hasLine ? '<i class="fa-brands fa-line text-emerald-400 text-xs" title="已連動 LINE"></i>' : ''}
                    </div>
                    <p class="text-[11px] text-slate-400 font-mono">${m.phone || '未登記電話'}</p>
                  </div>
                </div>

                <span class="text-[10px] px-2 py-0.5 rounded-lg bg-white/[0.05] border border-white/[0.08] text-slate-300">
                  ${m.group_name || '未編組'}
                </span>
              </div>

              <!-- 標籤雲：成熟度、恩賜 -->
              <div class="flex flex-wrap gap-1 items-center">
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-white/[0.04] text-slate-400">${m.faith_status || '委身家人'}</span>
                ${m.district ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-white/[0.04] text-slate-400">${m.district}</span>` : ''}
                ${ministries.map(item => `<span class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-300 font-medium">${item}</span>`).join('')}
              </div>
            </div>

            <!-- 操作列 -->
            <div class="pt-2 border-t border-white/[0.04] flex items-center justify-between">
              <span class="text-[10px] text-slate-500">${m.register_date || '會友名冊'}</span>
              <div class="flex gap-2">
                <button onclick="editMember(${m.id})" class="text-xs px-2.5 py-1 rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-slate-300">
                  <i class="fa-solid fa-pen mr-1"></i>編輯
                </button>
                <button onclick="deleteMember(${m.id})" class="text-xs px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-300">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function populateGroupFilterDropdown() {
      const select = document.getElementById('memberFilterGroupSelect');
      const terms = getChurchTerms(activeChurch);
      const groups = Array.from(new Set(cachedMembers.map(m => m.group_name).filter(Boolean)));
      
      select.innerHTML = `<option value="ALL">全部${terms.group}</option>` + groups.map(g => `<option value="${g}">${g}</option>`).join('');
    }

    function filterMembers() {
      const q = document.getElementById('memberSearch').value.toLowerCase();
      const filterGrp = document.getElementById('memberFilterGroupSelect').value;

      const filtered = cachedMembers.filter(m => {
        const matchesQ = (m.name && m.name.toLowerCase().includes(q)) || (m.phone && m.phone.includes(q));
        const matchesGrp = filterGrp === 'ALL' || m.group_name === filterGrp;
        return matchesQ && matchesGrp;
      });

      renderMembersCards(filtered);
    }

    // 初始化恩賜點選標籤 (Chips)
    function renderMinistryChips() {
      const container = document.getElementById('ministryChipsContainer');
      container.innerHTML = MINISTRY_OPTIONS.map(opt => {
        const isSel = selectedMinistries.has(opt);
        return `
          <div onclick="toggleMinistryChip('${opt}')" class="chip-btn px-2.5 py-1 rounded-lg text-[11px] font-medium border ${isSel ? 'selected' : 'bg-slate-900 border-white/10 text-slate-400'}">
            ${opt}
          </div>
        `;
      }).join('');
    }

    function toggleMinistryChip(name) {
      if (selectedMinistries.has(name)) selectedMinistries.delete(name);
      else selectedMinistries.add(name);
      renderMinistryChips();
    }

    function openMemberModal() {
      document.getElementById('editMemberId').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editPhone').value = '';
      document.getElementById('editFaithStatus').value = '委身家人';
      document.getElementById('editDistrict').value = '大雅區';
      
      // 填入小家下拉選單 (免打字)
      populateMemberModalGroupDropdown('未編組');

      selectedMinistries.clear();
      renderMinistryChips();

      document.getElementById('memberModalTitle').querySelector('span').innerText = '新增會友資料';
      document.getElementById('memberEditModal').classList.remove('hidden');
    }

    function populateMemberModalGroupDropdown(currentGroup) {
      const select = document.getElementById('editGroupSelect');
      const groups = ['未編組', ...cachedGroups.map(g => g.name)];
      select.innerHTML = groups.map(g => `<option value="${g}" ${g === currentGroup ? 'selected' : ''}>${g}</option>`).join('');
    }

    function editMember(id) {
      const m = cachedMembers.find(x => x.id === id);
      if (!m) return;

      document.getElementById('editMemberId').value = m.id;
      document.getElementById('editName').value = m.name;
      document.getElementById('editGender').value = m.gender || '弟兄';
      document.getElementById('editPhone').value = m.phone || '';
      document.getElementById('editFaithStatus').value = m.faith_status || '委身家人';
      document.getElementById('editDistrict').value = m.district || '大雅區';

      populateMemberModalGroupDropdown(m.group_name || '未編組');

      selectedMinistries.clear();
      if (m.ministry) {
        m.ministry.split(',').map(s => s.trim()).forEach(item => {
          if (item) selectedMinistries.add(item);
        });
      }
      renderMinistryChips();

      document.getElementById('memberModalTitle').querySelector('span').innerText = `編輯會友：${m.name}`;
      document.getElementById('memberEditModal').classList.remove('hidden');
    }

    function closeMemberModal() {
      document.getElementById('memberEditModal').classList.add('hidden');
    }

    async function saveMemberFromModal() {
      const id = document.getElementById('editMemberId').value;
      const name = document.getElementById('editName').value.trim();
      if (!name) return alert('會友姓名為必填！');

      const payload = {
        church_id: activeChurch,
        name: name,
        gender: document.getElementById('editGender').value,
        phone: document.getElementById('editPhone').value.trim(),
        group_name: document.getElementById('editGroupSelect').value,
        faith_status: document.getElementById('editFaithStatus').value,
        district: document.getElementById('editDistrict').value,
        ministry: Array.from(selectedMinistries).join(', ')
      };

      if (id) await db.from('members').update(payload).eq('id', id);
      else await db.from('members').insert([payload]);

      closeMemberModal();
      await loadMembers();
      await loadGroups();
    }

    async function deleteMember(id) {
      if (!confirm('確定自名冊中刪除此會友資料？')) return;
      await db.from('members').delete().eq('id', id);
      await loadMembers();
      await loadGroups();
    }

    // 2. 小家 / 小組 完整管理與人員調配
    async function loadGroups() {
      const { data } = await db.from('groups').select('*').eq('church_id', activeChurch).order('id');
      cachedGroups = data || [];
      renderGroupsCards();
    }

    function renderGroupsCards() {
      const container = document.getElementById('groupCardsGrid');
      const terms = getChurchTerms(activeChurch);

      if (!cachedGroups.length) {
        container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">目前尚無建立任何${terms.group}</div>`;
        return;
      }

      container.innerHTML = cachedGroups.map(g => {
        const members = cachedMembers.filter(m => m.group_name === g.name);
        return `
          <div class="glass-card rounded-2xl p-4 space-y-3 flex flex-col justify-between">
            <div class="space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-extrabold text-white text-base">${g.name}</h3>
                  <p class="text-xs text-indigo-400 font-semibold mt-0.5">${terms.leader}：${g.leader || '未設定'}</p>
                </div>
                <span class="text-xs px-2.5 py-1 rounded-xl bg-emerald-500/10 text-emerald-300 font-mono font-bold border border-emerald-500/20">
                  ${members.length} 人
                </span>
              </div>

              <div class="space-y-1 text-xs text-slate-400 pt-1">
                <p><i class="fa-regular fa-clock w-4 text-slate-500"></i> ${g.meeting_time || '時間彈性'}</p>
                <p><i class="fa-solid fa-location-dot w-4 text-slate-500"></i> ${g.location || '地點自訂'}</p>
              </div>
            </div>

            <div class="pt-2 border-t border-white/[0.04] flex items-center justify-between gap-2">
              <button onclick="openGroupMembersManageModal(${g.id})" class="flex-1 py-1.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] text-xs font-bold text-white transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-users-gear text-[11px] text-indigo-400"></i>
                <span>成員名單 (${members.length})</span>
              </button>
              <button onclick="editGroup(${g.id})" class="w-8 h-8 rounded-xl bg-white/[0.04] text-slate-400 hover:text-white flex items-center justify-center" title="編輯${terms.group}">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button onclick="deleteGroup(${g.id}, '${g.name}')" class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-300 hover:bg-rose-500/20 flex items-center justify-center" title="刪除${terms.group}">
                <i class="fa-solid fa-trash text-xs"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openGroupEditModal() {
      const terms = getChurchTerms(activeChurch);
      document.getElementById('editGroupId').value = '';
      document.getElementById('grpName').value = '';
      document.getElementById('grpMemo').value = '';

      populateLeaderDropdown('');

      document.getElementById('groupModalTitle').querySelector('span').innerText = `新增${terms.group}架構`;
      document.getElementById('groupEditModal').classList.remove('hidden');
    }

    function populateLeaderDropdown(currentLeader) {
      const select = document.getElementById('grpLeaderSelect');
      select.innerHTML = '<option value="">-- 請選取負責同工 --</option>' + 
        cachedMembers.map(m => `<option value="${m.name}" ${m.name === currentLeader ? 'selected' : ''}>${m.name} (${m.phone || '無電話'})</option>`).join('');
    }

    function editGroup(id) {
      const g = cachedGroups.find(x => x.id === id);
      if (!g) return;
      const terms = getChurchTerms(activeChurch);

      document.getElementById('editGroupId').value = g.id;
      document.getElementById('grpName').value = g.name;
      document.getElementById('grpTimeSelect').value = g.meeting_time || '每週五 19:30';
      document.getElementById('grpLocationSelect').value = g.location || '教會副堂';
      document.getElementById('grpMemo').value = g.memo || '';

      populateLeaderDropdown(g.leader || '');

      document.getElementById('groupModalTitle').querySelector('span').innerText = `編輯${terms.group}：${g.name}`;
      document.getElementById('groupEditModal').classList.remove('hidden');
    }

    function closeGroupEditModal() { document.getElementById('groupEditModal').classList.add('hidden'); }

    async function saveGroupData() {
      const id = document.getElementById('editGroupId').value;
      const name = document.getElementById('grpName').value.trim();
      const leader = document.getElementById('grpLeaderSelect').value;

      if (!name) return alert('名稱為必填！');
      if (!leader) return alert('請務必自下拉選單指派負責人！');

      const payload = {
        church_id: activeChurch,
        name: name,
        leader: leader,
        meeting_time: document.getElementById('grpTimeSelect').value,
        location: document.getElementById('grpLocationSelect').value,
        memo: document.getElementById('grpMemo').value.trim()
      };

      if (id) {
        const oldGrp = cachedGroups.find(x => x.id === parseInt(id));
        if (oldGrp && oldGrp.name !== name) {
          await db.from('members').update({ group_name: name }).eq('church_id', activeChurch).eq('group_name', oldGrp.name);
        }
        await db.from('groups').update(payload).eq('id', id);
      } else {
        await db.from('groups').insert([payload]);
      }

      closeGroupEditModal();
      await loadGroups();
      await loadMembers();
    }

    async function deleteGroup(id, name) {
      const terms = getChurchTerms(activeChurch);
      if (!confirm(`確定要刪除【${name}】${terms.group}？該組組員將轉為「未編組」！`)) return;
      await db.from('members').update({ group_name: '未編組' }).eq('church_id', activeChurch).eq('group_name', name);
      await db.from('groups').delete().eq('id', id);
      await loadGroups();
      await loadMembers();
    }

    // 小家組員調動抽屜
    function openGroupMembersManageModal(groupId) {
      activeManagingGroup = cachedGroups.find(x => x.id === groupId);
      if (!activeManagingGroup) return;

      const terms = getChurchTerms(activeChurch);
      document.getElementById('manageModalGroupTitle').innerText = `${activeManagingGroup.name}`;
      renderGroupMembersManagerList();
      populateUnassignedMembersDropdown();
      document.getElementById('groupMembersManageModal').classList.remove('hidden');
    }

    function closeGroupMembersManageModal() {
      activeManagingGroup = null;
      document.getElementById('groupMembersManageModal').classList.add('hidden');
    }

    function renderGroupMembersManagerList() {
      const container = document.getElementById('groupMemberListContainer');
      const terms = getChurchTerms(activeChurch);
      const members = cachedMembers.filter(m => m.group_name === activeManagingGroup.name);

      if (!members.length) {
        container.innerHTML = `<div class="py-8 text-center text-slate-500 text-xs">此${terms.group}暫無組員</div>`;
        return;
      }

      container.innerHTML = members.map(m => {
        const isLeader = activeManagingGroup.leader && activeManagingGroup.leader.includes(m.name);
        return `
          <div class="p-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg ${isLeader ? 'bg-amber-500/20 text-amber-300' : 'bg-white/[0.05] text-slate-300'} flex items-center justify-center font-bold">
                ${m.name.slice(0, 1)}
              </div>
              <div>
                <span class="font-bold text-white">${m.name}</span>
                ${isLeader ? `<span class="ml-1 text-[10px] px-1.5 py-0.2 rounded bg-amber-500/20 text-amber-300">${terms.leader}</span>` : ''}
                <p class="text-[10px] text-slate-400 font-mono">${m.phone || '無電話'}</p>
              </div>
            </div>

            <div class="flex items-center gap-1.5">
              ${!isLeader ? `
                <button onclick="setAsGroupLeader('${m.name}')" class="px-2 py-1 rounded bg-amber-500/10 text-amber-300 text-[10px] font-semibold">
                  設為${terms.leader}
                </button>
              ` : ''}
              <button onclick="removeMemberFromGroup(${m.id})" class="px-2 py-1 rounded bg-rose-500/10 text-rose-300 text-[10px] font-semibold">
                移出
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function populateUnassignedMembersDropdown() {
      const select = document.getElementById('unassignedOrOtherMemberSelect');
      const otherMembers = cachedMembers.filter(m => m.group_name !== activeManagingGroup.name);

      if (!otherMembers.length) {
        select.innerHTML = '<option value="">無其他可調入會友</option>';
        return;
      }

      select.innerHTML = otherMembers.map(m => `
        <option value="${m.id}">${m.name} (${m.group_name === '未編組' ? '未編組' : m.group_name})</option>
      `).join('');
    }

    async function setAsGroupLeader(memberName) {
      if (!activeManagingGroup) return;
      const terms = getChurchTerms(activeChurch);
      if (!confirm(`確定指派【${memberName}】為${terms.leader}？`)) return;
      await db.from('groups').update({ leader: memberName }).eq('id', activeManagingGroup.id);
      activeManagingGroup.leader = memberName;
      await loadGroups();
      renderGroupMembersManagerList();
    }

    async function removeMemberFromGroup(memberId) {
      const m = cachedMembers.find(x => x.id === memberId);
      if (!m || !activeManagingGroup) return;
      await db.from('members').update({ group_name: '未編組' }).eq('id', memberId);
      m.group_name = '未編組';
      renderGroupMembersManagerList();
      populateUnassignedMembersDropdown();
      renderGroupsCards();
      renderMembersCards(cachedMembers);
    }

    async function assignSelectedMemberToCurrentGroup() {
      const memberId = document.getElementById('unassignedOrOtherMemberSelect').value;
      if (!memberId || !activeManagingGroup) return;
      const m = cachedMembers.find(x => x.id === parseInt(memberId));
      if (!m) return;

      await db.from('members').update({ group_name: activeManagingGroup.name }).eq('id', m.id);
      m.group_name = activeManagingGroup.name;
      renderGroupMembersManagerList();
      populateUnassignedMembersDropdown();
      renderGroupsCards();
      renderMembersCards(cachedMembers);
    }

    // 3. 主日服事排程
    async function loadServices() {
      const { data } = await db.from('service_schedules').select('*').eq('church_id', activeChurch).order('service_date', { ascending: true });
      const c = document.getElementById('serviceCardsContainer');
      c.innerHTML = (data || []).map(s => `
        <div class="glass-card rounded-2xl p-4 space-y-2.5">
          <div class="flex justify-between items-center border-b border-white/[0.06] pb-2">
            <span class="font-bold text-sm text-white flex items-center gap-1.5">
              <i class="fa-regular fa-calendar" style="color: var(--brand-primary)"></i>
              <span>${s.service_date}</span>
            </span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-white/[0.06] text-slate-300">講道：${s.speaker || '未定'}</span>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs text-slate-300">
            <div>主領：<span class="text-white">${s.worship_leader || '-'}</span></div>
            <div>歌者：<span class="text-white">${s.singers || '-'}</span></div>
            <div>司琴/吉他：<span class="text-white">${s.keyboard}/${s.guitar}</span></div>
            <div>音控/導播：<span class="text-white">${s.tech_sound}/${s.tech_video}</span></div>
          </div>
        </div>
      `).join('');
    }

    // 4. 代禱關懷
    async function loadPrayers() {
      const { data } = await db.from('prayer_requests').select('*').eq('church_id', activeChurch).order('created_at', { ascending: false });
      const c = document.getElementById('prayerCardsList');
      c.innerHTML = (data || []).map(p => `
        <div class="glass-card rounded-2xl p-3.5 flex justify-between items-start text-xs">
          <div class="space-y-1">
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-sm text-white">${p.member_name}</span>
              <span class="text-[9px] px-1.5 py-0.2 rounded ${p.urgency_level && p.urgency_level.includes('緊急') ? 'bg-rose-500/20 text-rose-300' : 'bg-white/[0.06] text-slate-300'}">${p.urgency_level || '一般'}</span>
            </div>
            <p class="text-slate-300 text-xs">${p.content}</p>
          </div>
        </div>
      `).join('');
    }

    // 5. 超級管理員
    function loadChurchConfigInputs() {
      const target = document.getElementById('configChurchTarget').value;
      const c = cachedChurches[target] || {};
      document.getElementById('configColorText').value = c.primary_color || '#6366f1';
      document.getElementById('configColorPicker').value = c.primary_color || '#6366f1';
      document.getElementById('configLogoUrl').value = c.logo_url || '';
    }

    async function saveChurchBranding() {
      const target = document.getElementById('configChurchTarget').value;
      const color = document.getElementById('configColorText').value.trim();
      const logo = document.getElementById('configLogoUrl').value.trim();
      await db.from('churches').update({ primary_color: color, logo_url: logo }).eq('id', target);
      alert('風格配置儲存成功！');
      await loadChurchesConfig();
      applyChurchTheme(activeChurch);
    }

    async function loadAdminUsersList() {
      const { data } = await db.from('admin_users').select('*').order('id');
      cachedAdmins = data || [];
      const container = document.getElementById('adminUsersCardsList');
      container.innerHTML = cachedAdmins.map(u => `
        <div class="p-3 rounded-xl bg-white/[0.03] border border-white/[0.06] flex items-center justify-between text-xs">
          <div>
            <div class="flex items-center gap-1.5">
              <span class="font-bold text-white">${u.name}</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded ${u.assigned_church === 'SHiNE' ? 'bg-rose-500/15 text-rose-300' : u.assigned_church === 'M+' ? 'bg-blue-500/15 text-blue-300' : 'bg-purple-500/15 text-purple-300'}">
                ${u.assigned_church ? (u.assigned_church === 'SHiNE' ? '火樂' : 'M+') : '超級全堂'}
              </span>
            </div>
            <p class="text-[10px] text-slate-400 mt-1">
              權限：${[u.can_manage_members && '名冊', u.can_manage_schedules && '排班', u.can_manage_attendance && '小家', u.can_manage_prayers && '代禱'].filter(Boolean).join('、') || '無'}
            </p>
          </div>

          <div class="flex gap-1.5">
            ${u.role !== 'SUPER_ADMIN' ? `
              <button onclick="editAdminUser(${u.id})" class="px-2 py-1 rounded bg-white/[0.05] text-slate-300"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteAdminUser(${u.id}, '${u.name}')" class="px-2 py-1 rounded bg-rose-500/10 text-rose-300"><i class="fa-solid fa-trash"></i></button>
            ` : '<span class="text-[10px] text-slate-600 font-mono">最高</span>'}
          </div>
        </div>
      `).join('');
    }

    function openAdminModal() {
      document.getElementById('adminEditId').value = '';
      document.getElementById('admName').value = '';
      document.getElementById('admPwd').value = '';
      document.getElementById('pwdHint').classList.add('hidden');
      document.getElementById('permMembers').checked = true;
      document.getElementById('permSchedules').checked = true;
      document.getElementById('permAttendance').checked = true;
      document.getElementById('permPrayers').checked = true;
      document.getElementById('adminModalTitle').querySelector('span').innerText = '指派新管理員';
      document.getElementById('adminUserModal').classList.remove('hidden');
    }

    function editAdminUser(id) {
      const u = cachedAdmins.find(x => x.id === id);
      if (!u) return;
      document.getElementById('adminEditId').value = u.id;
      document.getElementById('admName').value = u.name;
      document.getElementById('admPwd').value = '';
      document.getElementById('pwdHint').classList.remove('hidden');
      document.getElementById('admChurch').value = u.assigned_church || 'SHiNE';
      document.getElementById('permMembers').checked = !!u.can_manage_members;
      document.getElementById('permSchedules').checked = !!u.can_manage_schedules;
      document.getElementById('permAttendance').checked = !!u.can_manage_attendance;
      document.getElementById('permPrayers').checked = !!u.can_manage_prayers;
      document.getElementById('adminModalTitle').querySelector('span').innerText = `編輯管理員：${u.name}`;
      document.getElementById('adminUserModal').classList.remove('hidden');
    }

    function closeAdminModal() { document.getElementById('adminUserModal').classList.add('hidden'); }

    async function saveAdminUser() {
      const id = document.getElementById('adminEditId').value;
      const name = document.getElementById('admName').value.trim();
      const pwd = document.getElementById('admPwd').value.trim();
      const church = document.getElementById('admChurch').value;

      if (!name) return alert('姓名不得為空！');
      if (!id && !pwd) return alert('新增必須設定密碼！');

      const payload = {
        name: name,
        assigned_church: church,
        can_manage_members: document.getElementById('permMembers').checked,
        can_manage_schedules: document.getElementById('permSchedules').checked,
        can_manage_attendance: document.getElementById('permAttendance').checked,
        can_manage_prayers: document.getElementById('permPrayers').checked
      };
      if (pwd) payload.password = pwd;

      if (id) await db.from('admin_users').update(payload).eq('id', id);
      else { payload.role = 'CHURCH_ADMIN'; await db.from('admin_users').insert([payload]); }

      closeAdminModal();
      loadAdminUsersList();
    }

    async function deleteAdminUser(id, name) {
      if (!confirm(`確定移除【${name}】的管理員資格？`)) return;
      await db.from('admin_users').delete().eq('id', id);
      loadAdminUsersList();
    }

    // 切換堂會
    function switchChurch(churchId) {
      activeChurch = churchId;
      applyChurchTheme(churchId);
      updateDynamicTerms(churchId);
      loadChurchData();
    }

    function switchTab(tabId) {
      ['members', 'services', 'groups', 'prayers', 'superadmin'].forEach(t => {
        const el = document.getElementById(`mod-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (el) el.classList.add('hidden');
        if (nav) nav.style.color = '#94a3b8';
      });
      const targetEl = document.getElementById(`mod-${tabId}`);
      const targetNav = document.getElementById(`nav-${tabId}`);
      if (targetEl) targetEl.classList.remove('hidden');
      if (targetNav) targetNav.style.color = 'var(--brand-primary)';
    }

    function logout() {
      currentUser = null;
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('loginPwd').value = '';
    }
  </script>
</body>
</html>
