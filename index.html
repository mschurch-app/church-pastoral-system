<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CHURCH OS · 智慧教牧行政治理平台</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root { --brand-accent: #f97316; --card-bg: rgba(255, 255, 255, 0.94); --card-border: rgba(234, 218, 198, 0.75); }
    body { background: radial-gradient(120% 80% at 50% -10%, #FFF2E2 0%, #FAF6F0 50%, #F5EEE6 100%); color: #1c1917; min-height: 100vh; }
    .lux-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; }
    .lux-card-newcomer { background: linear-gradient(135deg, rgba(255,247,237,0.96) 0%, rgba(255,255,255,0.98) 100%); border: 2px solid rgba(249, 115, 22, 0.45); border-radius: 24px; }
    .lux-header { background: rgba(250, 246, 240, 0.85); border-bottom: 1px solid rgba(234, 218, 198, 0.8); }
    .lux-dock { background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(234, 218, 198, 0.85); }
    .lux-modal { background: #FFFFFF; border: 1px solid rgba(234, 218, 198, 0.9); }
    .chip-item.active { background: #f97316 !important; color: #fff !important; }
    .btn-warm { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: #fff; }
    .ministry-badge-card { background: #FFF; border: 1px solid rgba(231, 222, 211, 0.7); border-radius: 14px; padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; }
  </style>
</head>
<body class="flex flex-col font-sans pb-32 lg:pb-12 antialiased">

  <header class="sticky top-0 z-40 lux-header px-4 sm:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center space-x-3.5">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center text-white btn-warm">
          <i id="churchLogoIcon" class="fa-solid fa-church"></i>
          <img id="churchLogoImg" class="w-full h-full object-cover hidden rounded-2xl" src="">
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="currentChurchLabel" class="text-base sm:text-lg font-black text-stone-800">載入中...</h1>
            <span id="adminRoleBadge" class="text-[10px] px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 font-bold">同工認證</span>
          </div>
          <p id="currentUserLabel" class="text-xs text-stone-500">智慧教牧治理平台</p>
        </div>
      </div>
      <div class="flex items-center gap-2.5">
        <div id="superChurchSelectorWrapper" class="hidden">
          <select id="superChurchSelector" onchange="switchChurch(this.value)" class="bg-white border text-xs font-bold rounded-xl px-3 py-2">
            <option value="SHiNE">火樂 (SHiNE)</option>
            <option value="M+">Ｍ＋大雅</option>
          </select>
        </div>
        <button onclick="logout()" class="w-9 h-9 rounded-xl bg-white text-stone-400 hover:text-rose-600 border flex items-center justify-center"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button>
      </div>
    </div>
  </header>

  <!-- 登入 Modal -->
  <div id="loginModal" class="fixed inset-0 bg-stone-900/40 z-50 flex items-center justify-center p-4">
    <div class="lux-modal p-8 rounded-[32px] max-w-sm w-full space-y-6">
      <h2 class="text-2xl font-black text-stone-800 text-center">歡迎回到同工之家</h2>
      <select id="loginNameSelect" class="w-full bg-stone-50 border rounded-2xl p-3 font-bold">
        <option value="吳俊璋">吳俊璋 牧師</option>
        <option value="謝碧鳳">謝碧鳳 師母</option>
        <option value="松慕強">松慕強 牧師</option>
      </select>
      <input type="password" id="loginPwd" class="w-full bg-stone-50 border rounded-2xl p-3" placeholder="授權密碼">
      <p id="loginError" class="text-xs text-rose-600 font-bold hidden"></p>
      <button onclick="handleAuthLogin()" class="w-full py-3.5 rounded-2xl btn-warm font-extrabold text-xs">安全驗證登入</button>
    </div>
  </div>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 relative z-10">
    <section id="mod-members" class="space-y-6 hidden">...</section>
    <section id="mod-services" class="space-y-6 hidden">...</section>
    <section id="mod-groups" class="space-y-6 hidden">...</section>
    <section id="mod-spaces" class="space-y-6 hidden">...</section>
    <section id="mod-prayers" class="space-y-6 hidden">...</section>
    <section id="mod-pastoral-bot" class="space-y-6 hidden">...</section>
    <section id="mod-superadmin" class="space-y-6 hidden">...</section>
  </main>

  <nav class="fixed bottom-5 inset-x-4 max-w-xl mx-auto lux-dock rounded-3xl z-30 px-3 py-2.5 flex justify-around">
    <button onclick="switchTab('members')" id="nav-members" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-users text-sm"></i><span class="text-[10px]">會友</span></button>
    <button onclick="switchTab('services')" id="nav-services" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-hand-holding-heart text-sm"></i><span class="text-[10px]">服事</span></button>
    <button onclick="switchTab('groups')" id="nav-groups" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-people-roof text-sm"></i><span class="text-[10px]">小家</span></button>
    <button onclick="switchTab('spaces')" id="nav-spaces" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-door-open text-sm"></i><span class="text-[10px]">空間</span></button>
    <button onclick="switchTab('prayers')" id="nav-prayers" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-hands-praying text-sm"></i><span class="text-[10px]">代禱</span></button>
    <button onclick="switchTab('pastoral-bot')" id="nav-pastoral-bot" class="flex flex-col items-center gap-1 text-stone-400"><i class="fa-solid fa-paper-plane text-sm"></i><span class="text-[10px]">推播</span></button>
  </nav>

 <!-- 引入主控導航與各模組 JS -->
  <script type="module">
    import { state, db, getChurchTerms } from './js/state.js';
    import { loadMembers } from './js/members.js';
    import { loadGroups } from './js/groups.js';
    import { loadServices } from './js/services.js';
    import { loadRoomsAndSpaces } from './js/spaces.js';
    import { loadPrayers } from './js/prayers.js';
    import { loadPastoralBotSettings } from './js/pastoral-bot.js';
    import { loadAdminUsersList } from './js/superadmin.js';

    // 1. 將核心控制函式明確掛載到 window，供 HTML 的 onclick 呼叫
    window.switchTab = function(tabId) {
      ['members', 'services', 'groups', 'spaces', 'prayers', 'pastoral-bot', 'superadmin'].forEach(t => {
        const el = document.getElementById(`mod-${t}`);
        const nav = document.getElementById(`nav-${t}`);
        if (el) el.classList.add('hidden');
        if (nav) { nav.classList.remove('text-orange-600'); nav.classList.add('text-stone-400'); }
      });
      const targetMod = document.getElementById(`mod-${tabId}`);
      const targetNav = document.getElementById(`nav-${tabId}`);
      if (targetMod) targetMod.classList.remove('hidden');
      if (targetNav) targetNav.classList.replace('text-stone-400', 'text-orange-600');
    }

    window.switchChurch = function(churchId) {
      state.activeChurch = churchId;
      localStorage.setItem('church_os_active_church', churchId);
      loadChurchData();
    }

    async function loadChurchData() {
      // 確保畫面標籤更新
      const churchName = (state.activeChurch === 'SHiNE') ? '火樂教會 (SHiNE)' : 'Ｍ＋大雅教會';
      const churchLabel = document.getElementById('currentChurchLabel');
      if (churchLabel) churchLabel.innerText = churchName;

      await loadMembers();
      await loadGroups();
      await loadRoomsAndSpaces();
      await loadServices();
      await loadPrayers();
      await loadPastoralBotSettings();
      switchTab('members');
    }

    window.handleAuthLogin = async function() {
      const name = document.getElementById('loginNameSelect').value;
      const pwd = document.getElementById('loginPwd').value;
      const { data, error } = await db.from('admin_users').select('*').eq('name', name).eq('password', pwd);
      
      if (error || !data || !data.length) {
        const errEl = document.getElementById('loginError');
        if (errEl) {
          errEl.innerText = '授權密碼錯誤，請重新確認！';
          errEl.classList.remove('hidden');
        }
        return;
      }

      state.currentUser = data[0];
      localStorage.setItem('church_os_current_user', JSON.stringify(state.currentUser));
      document.getElementById('loginModal').classList.add('hidden');
      
      state.activeChurch = state.currentUser.assigned_church || 'SHiNE';
      localStorage.setItem('church_os_active_church', state.activeChurch);
      
      const userLabel = document.getElementById('currentUserLabel');
      if (userLabel) userLabel.innerText = `目前同工：${state.currentUser.name}`;

      loadChurchData();
    }

    window.logout = function() {
      localStorage.clear();
      location.reload();
    }

    // 2. 頁面載入自動檢查登入狀態
    window.addEventListener('DOMContentLoaded', async () => {
      const savedUserStr = localStorage.getItem('church_os_current_user');
      const savedChurch = localStorage.getItem('church_os_active_church');
      
      if (savedUserStr) {
        try {
          state.currentUser = JSON.parse(savedUserStr);
          document.getElementById('loginModal').classList.add('hidden');
          const userLabel = document.getElementById('currentUserLabel');
          if (userLabel) userLabel.innerText = `目前同工：${state.currentUser.name}`;

          state.activeChurch = savedChurch || state.currentUser.assigned_church || 'SHiNE';
          loadChurchData();
        } catch (e) {
          localStorage.clear();
        }
      }
    });
  </script>
</body>
</html>
