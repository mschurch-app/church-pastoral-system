<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>同心微光 · 動態漂浮代禱牆</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(ellipse at 50% 30%, #1c1917 0%, #0c0a09 60%, #000000 100%);
      color: #fafaf9;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      user-select: none;
    }

    /* 縮小後的光球容器 */
    .floating-orb {
      position: absolute;
      border-radius: 9999px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      will-change: transform;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    /* 精巧光暈 */
    .orb-glow {
      background: radial-gradient(circle, rgba(245, 158, 11, 0.28) 0%, rgba(217, 119, 6, 0.15) 60%, rgba(0,0,0,0.5) 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.25), inset 0 0 10px rgba(251, 191, 36, 0.2);
    }

    .orb-glow:hover {
      border-color: rgba(251, 191, 36, 0.9);
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(251, 191, 36, 0.35);
    }

    .orb-answered {
      background: radial-gradient(circle, rgba(234, 88, 12, 0.35) 0%, rgba(245, 158, 11, 0.2) 60%, rgba(0,0,0,0.6) 100%);
      border: 2px solid #F59E0B;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
    }

    /* 環繞衛星外圈容器 */
    .satellite-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    /* 代禱文發光小星點 */
    .satellite-dot {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      background: #FEF08A;
      box-shadow: 0 0 8px #F59E0B, 0 0 14px #D97706;
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s ease;
    }
    .satellite-dot:hover {
      transform: translate(-50%, -50%) scale(1.6);
    }

    /* 升起發光的禱告手動畫 */
    @keyframes risePrayHand {
      0% { transform: translate(-50%, 15px) scale(0.6); opacity: 0; }
      30% { transform: translate(-50%, -10px) scale(1.3); opacity: 1; filter: drop-shadow(0 0 14px #F59E0B); }
      70% { transform: translate(-50%, -20px) scale(1.1); opacity: 1; filter: drop-shadow(0 0 20px #F59E0B); }
      100% { transform: translate(-50%, -45px) scale(1.4); opacity: 0; }
    }
    .pray-hand-anim {
      position: absolute;
      top: 50%;
      left: 50%;
      animation: risePrayHand 1.1s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      pointer-events: none;
      z-index: 50;
    }

    /* 禱告震波 */
    @keyframes prayerShockwave {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }
    .shockwave-anim {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 9999px;
      border: 2px solid rgba(251, 191, 36, 0.85);
      animation: prayerShockwave 1s ease-out forwards;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body>

  <!-- 頂部輕量導覽條 -->
  <header class="fixed top-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-auto">
    <div class="flex items-center gap-2.5 bg-stone-900/85 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-stone-800 shadow-xl">
      <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
      <div>
        <h1 class="text-xs font-black tracking-wider text-amber-200" id="wallTitle">Ｍ＋大雅教會 · 祭壇代禱牆</h1>
        <p class="text-[9px] text-stone-400">點擊光球看代禱清單 · 舉手同心托住</p>
      </div>
    </div>

    <!-- 點火發起代禱按鈕 -->
    <button onclick="openCreatePrayerModal()" class="px-3.5 py-2 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-600 text-stone-950 font-black text-xs shadow-lg flex items-center gap-1.5 hover:scale-105 transition active:scale-95">
      <i class="fa-solid fa-fire text-white text-xs"></i>
      <span>提送代禱</span>
    </button>
  </header>

  <!-- 🌟 全螢幕漂浮畫布舞台 🌟 -->
  <main id="prayerSpaceCanvas" class="w-full h-full relative overflow-hidden">
    <!-- 空狀態提示 (無代禱時顯示) -->
    <div id="emptyStateNotice" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center p-6 space-y-2">
      <i class="fa-solid fa-fire-burner text-amber-500/40 text-4xl mb-1 animate-pulse"></i>
      <div class="text-sm font-black text-stone-400">祭壇之火預備中</div>
      <p class="text-xs text-stone-600">目前尚無代禱事項，點擊右上角「提送代禱」點燃第一盞燭光！</p>
    </div>
  </main>

  <!-- 底部微引導與統計 -->
  <footer class="fixed bottom-4 inset-x-0 flex justify-center z-30 pointer-events-none">
    <div class="bg-stone-900/75 backdrop-blur-md px-4 py-1.5 rounded-full border border-stone-800 text-[10px] text-stone-400 font-bold flex items-center gap-3 pointer-events-auto">
      <span><i class="fa-solid fa-hands-praying text-amber-400 mr-1"></i>今日同心代禱：<strong class="text-amber-300" id="totalPrayersCount">0</strong> 次</span>
      <span class="text-stone-600">|</span>
      <span><i class="fa-regular fa-clock text-orange-400 mr-1"></i>7 天常駐生命祭壇</span>
    </div>
  </footer>

  <!-- ================= 彈窗 A：代禱詳情、誰禱告了、代禱文與同心按手 ================= -->
  <div id="prayerDetailModal" class="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-stone-900/95 border border-amber-500/40 rounded-3xl p-5 space-y-3.5 text-stone-100 shadow-2xl relative max-h-[90vh] flex flex-col">
      
      <button onclick="closeDetailModal()" class="absolute top-4 right-4 text-stone-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- 標題與提請人 -->
      <div class="space-y-1 pr-6 flex-shrink-0">
        <div class="flex items-center gap-1.5">
          <span class="px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-[10px] font-black text-amber-300" id="modalAuthorTag">-</span>
          <span class="text-[10px] text-stone-400" id="modalDaysTag">-</span>
        </div>
        <h3 class="text-sm font-black text-amber-100 leading-snug" id="modalTitle">-</h3>
      </div>

      <!-- 代禱主內文 -->
      <div class="bg-stone-950/70 p-3 rounded-2xl border border-stone-800 text-xs text-stone-300 font-serif leading-relaxed flex-shrink-0" id="modalContent">
        -
      </div>

      <!-- 📜 誰禱告了與代禱文歷史列表 (可垂直滾動) -->
      <div class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[120px]">
        <div class="text-[11px] font-black text-amber-300 flex items-center justify-between sticky top-0 bg-stone-900/95 py-1 z-10 border-b border-stone-800">
          <span class="flex items-center gap-1">
            <i class="fa-solid fa-cloud-moon text-amber-400"></i>
            <span>守望禱告歷程 (<span id="modalCommentsCount">0</span>)</span>
          </span>
          <span class="text-[10px] text-stone-400 font-normal">依時間排序</span>
        </div>
        
        <div class="space-y-2" id="modalCommentsList">
          <!-- 動態插入代禱文與作者 -->
        </div>
      </div>

      <!-- 留下代禱文輸入框 -->
      <div class="space-y-1 flex-shrink-0 pt-1 border-t border-stone-800">
        <div class="flex gap-1.5">
          <input type="text" id="inputCommentAuthor" placeholder="你的名字" class="w-24 bg-stone-950 border border-stone-700 rounded-xl px-2.5 py-2 text-xs text-stone-200 focus:outline-none focus:border-amber-400">
          <input type="text" id="inputCommentPrayer" placeholder="寫下一句禱告祝福，將化為光點圍繞..." class="flex-1 bg-stone-950 border border-stone-700 rounded-xl px-2.5 py-2 text-xs text-stone-200 focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- 核心互動按鈕 -->
      <div class="grid grid-cols-2 gap-2 pt-1 flex-shrink-0">
        <button onclick="triggerPrayFromModal()" class="py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 font-black text-xs flex items-center justify-center gap-1.5 shadow-lg active:scale-95 transition">
          <span class="text-sm">🙏</span>
          <span>按手同心禱告</span>
        </button>
        <button onclick="submitCommentFromModal()" class="py-2.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-amber-200 border border-amber-400/30 font-bold text-xs flex items-center justify-center gap-1">
          <i class="fa-solid fa-sparkles text-xs"></i>
          <span>送出環繞禱告文</span>
        </button>
      </div>

    </div>
  </div>

  <!-- ================= 彈窗 B：點燃新代禱 (加入姓名自動關聯小組) ================= -->
  <div id="createPrayerModal" class="fixed inset-0 bg-black/65 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="w-full max-w-sm bg-stone-900 border border-amber-500/40 rounded-3xl p-5 space-y-3 text-stone-100 shadow-2xl">
      <div class="flex items-center justify-between border-b border-stone-800 pb-2">
        <h3 class="text-sm font-black text-amber-300 flex items-center gap-1.5">
          <i class="fa-solid fa-fire text-orange-500"></i>
          <span>提送代禱事項 (7天漂浮守望)</span>
        </h3>
        <button onclick="closeCreatePrayerModal()" class="text-stone-400 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-2 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-stone-400 font-bold block mb-1">提請人姓名：</label>
            <div class="relative">
              <input type="text" id="newPrayerAuthor" oninput="debounceLookupMember(this.value)" placeholder="輸入你的姓名" class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-stone-200 focus:outline-none focus:border-amber-400">
              <span id="authorLookupSpinner" class="absolute right-2.5 top-2.5 text-[10px] text-amber-400 hidden">
                <i class="fa-solid fa-spinner fa-spin"></i>
              </span>
            </div>
          </div>
          <div>
            <label class="text-stone-400 font-bold block mb-1">所屬<span class="group-term-label">小組</span>：</label>
            <div class="relative">
              <input type="text" id="newPrayerGroup" placeholder="輸入姓名自動帶出" class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-stone-200 focus:outline-none focus:border-amber-400 font-bold">
              <span id="groupAutoBadge" class="absolute right-2 top-2 text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-black hidden">名冊關聯</span>
            </div>
          </div>
        </div>

        <div>
          <label class="text-stone-400 font-bold block mb-1">代禱主題：</label>
          <input type="text" id="newPrayerTitle" placeholder="例如：母親手術順利、工作突破、心靈平安..." class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-stone-200 focus:outline-none focus:border-amber-400">
        </div>
        
        <div>
          <label class="text-stone-400 font-bold block mb-1">具體代禱細節：</label>
          <textarea id="newPrayerContent" rows="3" placeholder="具體寫下需要，讓大家的禱告手一起托住你..." class="w-full bg-stone-950 border border-stone-700 rounded-xl p-2 text-stone-200 focus:outline-none focus:border-amber-400"></textarea>
        </div>
      </div>

      <button onclick="submitNewFloatingPrayer()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-stone-950 font-black text-xs shadow-lg active:scale-95 transition">
        送上祭壇 · 點燃禱告之火
      </button>
    </div>
  </div>

  <script type="module">
    import { db, state, getChurchTerms } from './js/state.js';

    // 堂會隔離解析
    const urlParams = new URLSearchParams(window.location.search);
    let targetChurch = urlParams.get('church') || 'M+';
    if (targetChurch.toUpperCase().startsWith('SHINE')) targetChurch = 'SHiNE';
    else targetChurch = 'M+';

    const isShine = (targetChurch === 'SHiNE');
    const groupTerm = isShine ? '小家' : '小組';

    let orbs = [];
    let currentSelectedOrb = null;
    let lookupTimer = null;
    const spaceCanvas = document.getElementById('prayerSpaceCanvas');
    const emptyNotice = document.getElementById('emptyStateNotice');

    // 0. 自動依姓名查詢名冊小組/小家
    window.debounceLookupMember = function(name) {
      clearTimeout(lookupTimer);
      const trimmed = name.trim();
      const badgeEl = document.getElementById('groupAutoBadge');
      const groupInput = document.getElementById('newPrayerGroup');
      const spinnerEl = document.getElementById('authorLookupSpinner');

      if (!trimmed) {
        if (groupInput) groupInput.value = '';
        if (badgeEl) badgeEl.classList.add('hidden');
        if (spinnerEl) spinnerEl.classList.add('hidden');
        return;
      }

      lookupTimer = setTimeout(async () => {
        if (spinnerEl) spinnerEl.classList.remove('hidden');

        try {
          const { data, error } = await db
            .from('members')
            .select('name, group_name')
            .eq('church_id', targetChurch)
            .eq('name', trimmed)
            .maybeSingle();

          if (spinnerEl) spinnerEl.classList.add('hidden');

          if (data && data.group_name) {
            groupInput.value = data.group_name;
            if (badgeEl) badgeEl.classList.remove('hidden');
          } else {
            if (badgeEl) badgeEl.classList.add('hidden');
          }
        } catch (err) {
          if (spinnerEl) spinnerEl.classList.add('hidden');
          console.error('查詢會友小組失敗:', err);
        }
      }, 350);
    };

    // 1. 從 Supabase 載入真實上線代禱事項與環繞留言
    async function loadPrayersFromDb() {
      try {
        const { data: prayers, error } = await db
          .from('prayers')
          .select(`
            id, church_id, author_name, group_name, title, content, hands_count, is_answered, created_at, expires_at,
            prayer_comments ( id, author_name, comment_text, created_at )
          `)
          .eq('church_id', targetChurch)
          .gt('expires_at', new Date().toISOString())
          .order('created_at', { ascending: false });

        if (error) throw error;

        let totalHands = 0;

        orbs = (prayers || []).map((p, idx) => {
          totalHands += (p.hands_count || 1);
          
          const now = new Date();
          const exp = new Date(p.expires_at);
          const daysLeft = Math.max(1, Math.ceil((exp - now) / (1000 * 60 * 60 * 24)));

          const calculatedRadius = Math.min(52, 38 + Math.floor((p.hands_count || 1) / 5));
          const padding = 60;
          return {
            id: p.id,
            author: p.author_name,
            group: p.group_name || '未編組',
            title: p.title,
            content: p.content,
            hands: p.hands_count || 1,
            daysLeft: daysLeft,
            isAnswered: p.is_answered,
            comments: p.prayer_comments || [],
            x: padding + Math.random() * (window.innerWidth - padding * 2),
            y: padding + 60 + Math.random() * (window.innerHeight - padding * 2 - 80),
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            radius: calculatedRadius,
            orbitAngle: Math.random() * Math.PI * 2
          };
        });

        document.getElementById('totalPrayersCount').innerText = totalHands;
        initOrbsDOM();
      } catch (err) {
        console.error('載入代禱牆失敗:', err);
      }
    }

    // 2. 初始化 DOM 光球
    function initOrbsDOM() {
      spaceCanvas.querySelectorAll('.floating-orb').forEach(el => el.remove());

      if (!orbs.length) {
        emptyNotice.classList.remove('hidden');
        return;
      }
      emptyNotice.classList.add('hidden');

      orbs.forEach(orb => {
        const el = document.createElement('div');
        el.id = `orb_${orb.id}`;
        el.className = `floating-orb ${orb.isAnswered ? 'orb-answered' : 'orb-glow'}`;
        el.onclick = () => openDetailModal(orb.id);
        spaceCanvas.appendChild(el);
      });
    }

    // 3. 物理漂浮碰撞演算法 (加入柔和互斥，防止重疊)
    function animateFloat() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      for (let i = 0; i < orbs.length; i++) {
        const o1 = orbs[i];

        o1.x += o1.vx;
        o1.y += o1.vy;

        if (o1.x - o1.radius < 15) { o1.x = o1.radius + 15; o1.vx *= -1; }
        if (o1.x + o1.radius > width - 15) { o1.x = width - o1.radius - 15; o1.vx *= -1; }
        if (o1.y - o1.radius < 65) { o1.y = o1.radius + 65; o1.vy *= -1; }
        if (o1.y + o1.radius > height - 70) { o1.y = height - o1.radius - 70; o1.vy *= -1; }

        for (let j = i + 1; j < orbs.length; j++) {
          const o2 = orbs[j];
          const dx = o2.x - o1.x;
          const dy = o2.y - o1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = o1.radius + o2.radius + 20;

          if (dist < minDist && dist > 0) {
            const overlap = (minDist - dist) * 0.02;
            const nx = dx / dist;
            const ny = dy / dist;
            o1.x -= nx * overlap;
            o1.y -= ny * overlap;
            o2.x += nx * overlap;
            o2.y += ny * overlap;
          }
        }

        o1.orbitAngle += 0.022;

        const el = document.getElementById(`orb_${o1.id}`);
        if (el) {
          const size = o1.radius * 2;
          el.style.width = `${size}px`;
          el.style.height = `${size}px`;
          el.style.transform = `translate3d(${o1.x - o1.radius}px, ${o1.y - o1.radius}px, 0)`;
          renderOrbInner(el, o1);
        }
      }

      requestAnimationFrame(animateFloat);
    }

    // 4. 繪製縮小版球體內部與圍繞衛星
    function renderOrbInner(el, orb) {
      let satellitesHtml = '';
      const commentCount = orb.comments.length;

      orb.comments.forEach((c, idx) => {
        const step = (Math.PI * 2) / Math.max(commentCount, 1);
        const currentAngle = orb.orbitAngle + (step * idx);
        const orbitDist = orb.radius + 15;
        const satX = Math.cos(currentAngle) * orbitDist;
        const satY = Math.sin(currentAngle) * orbitDist;

        satellitesHtml += `
          <div class="satellite-dot" style="left: ${satX}px; top: ${satY}px;" title="${c.author_name}：${c.comment_text}"></div>
        `;
      });

      el.innerHTML = `
        <div class="satellite-wrap">
          ${satellitesHtml}
        </div>

        <div class="text-center p-1.5 z-10 pointer-events-none">
          <span class="text-[8.5px] text-amber-300/80 font-bold block truncate max-w-[65px] mx-auto">${orb.author}</span>
          <h4 class="text-[10.5px] font-black text-amber-100 tracking-tight line-clamp-1 max-w-[70px] mx-auto leading-tight">${orb.title}</h4>
          
          <div class="mt-0.5 inline-flex items-center gap-1 text-[9px] font-black text-amber-300 bg-black/40 px-1.5 py-0.2 rounded-full border border-amber-400/30">
            <span>🙏 ${orb.hands}</span>
            ${commentCount > 0 ? `<span class="text-amber-400/80">💬 ${commentCount}</span>` : ''}
          </div>
        </div>
      `;
    }

    // 5. 禱告視覺動態
    function triggerPrayVisual(orbId) {
      const el = document.getElementById(`orb_${orbId}`);
      if (!el) return;

      const handEl = document.createElement('div');
      handEl.className = 'pray-hand-anim text-3xl';
      handEl.innerText = '🙏';
      el.appendChild(handEl);

      const shockwave = document.createElement('div');
      shockwave.className = 'shockwave-anim';
      shockwave.style.width = `${el.offsetWidth}px`;
      shockwave.style.height = `${el.offsetHeight}px`;
      el.appendChild(shockwave);

      setTimeout(() => {
        handEl.remove();
        shockwave.remove();
      }, 1100);
    }

    // 6. 彈窗：開啟詳情與代禱記錄
    window.openDetailModal = function(id) {
      const orb = orbs.find(x => x.id === id);
      if (!orb) return;
      currentSelectedOrb = orb;

      document.getElementById('modalAuthorTag').innerText = `${orb.author} · ${orb.group}`;
      document.getElementById('modalDaysTag').innerText = `剩餘 ${orb.daysLeft} 天`;
      document.getElementById('modalTitle').innerText = orb.title;
      document.getElementById('modalContent').innerText = orb.content;
      document.getElementById('modalCommentsCount').innerText = orb.comments.length;

      const listContainer = document.getElementById('modalCommentsList');
      if (!orb.comments.length) {
        listContainer.innerHTML = '<div class="text-[11px] text-stone-500 italic p-3 text-center bg-stone-950/40 rounded-xl">尚未有留下的代禱文，留下第一句代禱祝福吧！</div>';
      } else {
        listContainer.innerHTML = orb.comments.map(c => `
          <div class="p-2.5 rounded-xl bg-stone-950/90 border border-amber-500/20 text-xs space-y-1">
            <div class="flex items-center justify-between">
              <span class="font-black text-amber-300 text-[11px]"><i class="fa-solid fa-hands-praying mr-1 text-[10px]"></i>${c.author_name}</span>
              <span class="text-[9px] text-stone-500">${c.created_at ? new Date(c.created_at).toLocaleDateString('zh-TW', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '剛剛'}</span>
            </div>
            <p class="text-stone-300 font-serif leading-relaxed text-[11px]">${c.comment_text}</p>
          </div>
        `).join('');
      }

      document.getElementById('prayerDetailModal').classList.remove('hidden');
    };

    window.closeDetailModal = function() {
      document.getElementById('prayerDetailModal').classList.add('hidden');
    };

    // 彈窗內點擊按手同心
    window.triggerPrayFromModal = async function() {
      if (!currentSelectedOrb) return;
      currentSelectedOrb.hands += 1;
      currentSelectedOrb.radius = Math.min(52, currentSelectedOrb.radius + 0.5);

      triggerPrayVisual(currentSelectedOrb.id);
      closeDetailModal();

      const totalEl = document.getElementById('totalPrayersCount');
      totalEl.innerText = parseInt(totalEl.innerText || 0) + 1;

      await db.from('prayers')
        .update({ hands_count: currentSelectedOrb.hands })
        .eq('id', currentSelectedOrb.id);
    };

    // 彈窗內送出環繞代禱文
    window.submitCommentFromModal = async function() {
      if (!currentSelectedOrb) return;
      const author = document.getElementById('inputCommentAuthor').value.trim() || '肢體家人';
      const text = document.getElementById('inputCommentPrayer').value.trim();
      if (!text) return alert('請填寫禱告祝福話語！');

      const newComment = {
        prayer_id: currentSelectedOrb.id,
        church_id: targetChurch,
        author_name: author,
        comment_text: text
      };

      const { data, error } = await db.from('prayer_comments').insert([newComment]).select().single();
      
      currentSelectedOrb.comments.push(data || newComment);
      currentSelectedOrb.hands += 1;
      
      triggerPrayVisual(currentSelectedOrb.id);
      document.getElementById('inputCommentPrayer').value = '';
      closeDetailModal();
    };

    // 7. 提送全新代禱
    window.openCreatePrayerModal = function() { document.getElementById('createPrayerModal').classList.remove('hidden'); };
    window.closeCreatePrayerModal = function() { 
      document.getElementById('createPrayerModal').classList.add('hidden'); 
      const badgeEl = document.getElementById('groupAutoBadge');
      if (badgeEl) badgeEl.classList.add('hidden');
    };

    window.submitNewFloatingPrayer = async function() {
      const author = document.getElementById('newPrayerAuthor').value.trim();
      const group = document.getElementById('newPrayerGroup').value.trim();
      const title = document.getElementById('newPrayerTitle').value.trim();
      const content = document.getElementById('newPrayerContent').value.trim();

      if (!author || !title || !content) return alert('請完整填寫姓名、代禱主題與內容！');

      const payload = {
        church_id: targetChurch,
        author_name: author,
        group_name: group || '未編組',
        title: title,
        content: content,
        hands_count: 1
      };

      const { data, error } = await db.from('prayers').insert([payload]).select().single();
      if (error) {
        alert('提送失敗，請檢查網路連線');
        return;
      }

      closeCreatePrayerModal();
      document.getElementById('newPrayerAuthor').value = '';
      document.getElementById('newPrayerGroup').value = '';
      document.getElementById('newPrayerTitle').value = '';
      document.getElementById('newPrayerContent').value = '';

      await loadPrayersFromDb();
      if (data) triggerPrayVisual(data.id);
    };

    // 初始化運行
    window.onload = () => {
      document.querySelectorAll('.group-term-label').forEach(el => el.innerText = groupTerm);
      const titleEl = document.getElementById('wallTitle');
      if (isShine) {
        titleEl.innerText = '火樂教會 SHiNE · 守望金香爐';
      } else {
        titleEl.innerText = 'Ｍ＋大雅教會 · 祭壇代禱牆';
      }

      loadPrayersFromDb();
      animateFloat();
    };
  </script>
</body>
</html>
